no-git = true
metadata-hints = ["benchmark=deno-cargo-layers", "lane=sccache-only", "phase=desktop"]
command = [
  "cargo",
  "build",
  "-Zbuild-std=core,alloc,std,proc_macro,panic_abort",
  "--release",
  "--locked",
  "-p",
  "denort_desktop",
]
