workspace = "boringcache/benchmark-deno"

[entries.cargo-registry]
tag = "deno-cargo-layers-1181-0752844-registry"

[entries.cargo-target]
kind = "cargo-target"
tag = "deno-cargo-layers-1181-0752844-target"
path = "target"

[profiles.cargo-product]
entries = ["cargo-registry"]

[adapters.sccache]
tag = "deno-cargo-layers-1181-0752844-sccache"
no-git = true
metadata-hints = ["benchmark=deno-cargo-layers", "layer=compiler"]

[adapters.cargo]
profiles = ["cargo-product"]
