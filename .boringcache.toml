workspace = "boringcache/benchmark-deno"

# Deno's existing target archive is the comparison baseline. The pure
# BoringCache lane restores only Cargo state and remote compiler artifacts. The
# explicitly labelled release-hybrid profile also preserves Deno's capped
# ThinLTO cache without restoring the rest of target/.

[entries.cargo-registry]
tag = "deno-cargo-registry-local"

[entries.cargo-git]
tag = "deno-cargo-git-local"

[entries.cargo-target]
kind = "cargo-target"
tag = "deno-cargo-target-local"
path = "upstream/target"

# boringcache/one restores this profile before mise installs the exact version.
# Keep the tag and path aligned with DENO_RUST_VERSION in benchmark-source.env.
[entries.rust-toolchain]
tag = "deno-rust-toolchain-1-95-0"
path = "~/.local/share/mise/installs/rust/1.95.0"

[entries.release-lto]
tag = "deno-release-lto-cache-local"
path = "upstream/target/release/lto-cache"

# Mirrors the directory paths restored by Deno's Actions cache lane. The
# promotion workflow starts from that exact archive, so registry source trees
# and Git checkouts excluded by the source cache are not introduced here.
[entries.actions-cargo-registry]
tag = "deno-actions-cargo-registry-local"
path = "~/.cargo/registry"

[entries.actions-cargo-bin]
tag = "deno-actions-cargo-bin-local"
path = "~/.cargo/bin"

[entries.actions-target]
tag = "deno-actions-target-local"
path = "upstream/target"

[profiles.cargo]
entries = ["cargo-registry"]

[profiles.cargo-product]
entries = ["cargo-registry", "cargo-git", "cargo-target"]

[profiles.rust-toolchain]
entries = ["rust-toolchain"]

[profiles.release-hybrid]
entries = ["cargo-registry", "release-lto"]

[profiles.full-target]
entries = [
  "actions-cargo-registry",
  "actions-cargo-bin",
  "actions-target",
]

[profiles.target-only]
entries = ["actions-target"]

# Adapter-only control used when another product owns the target archive. This
# keeps BoringCache's sccache transport identical while changing only the
# target materialization path.
[profiles.sccache-only]
entries = []

[adapters.sccache]
tag = "deno-rust-cache-local"
command = ["./scripts/run-deno-build.sh"]
no-git = true

[adapters.cargo]
tag = "deno-rust-cache-local"
profiles = ["cargo-product"]
no-git = true
metadata-hints = ["benchmark=deno", "lane=cargo-product"]
