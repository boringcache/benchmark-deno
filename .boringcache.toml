workspace = "boringcache/benchmark-deno"

# Deno's existing target archive is the comparison baseline. The BoringCache
# lane intentionally restores Cargo state and uses the managed remote sccache
# proxy without archiving target/, so the rolling result isolates compiler
# artifact reuse from whole-directory target restoration.

[entries.cargo-registry]
tag = "deno-cargo-registry-local"

[profiles.cargo]
entries = ["cargo-registry"]

[adapters.sccache]
tag = "deno-release-rust-cache-local"
command = ["./scripts/run-deno-release-build.sh"]
no-git = true
