workspace = "boringcache/benchmark-deno"

# The root plan owns the persistent rolling chain. The release comparison uses
# separate committed plans under plans/ so the compiler cache and Cargo target
# can be judged independently without rewriting this file in a workflow.

[entries.cargo-registry]
tag = "deno-cargo-registry-rolling-main"

[entries.cargo-target]
kind = "cargo-target"
tag = "deno-cargo-target-rolling-main"
path = "upstream/target"

[profiles.cargo-product]
entries = ["cargo-registry", "cargo-target"]

[adapters.sccache]
tag = "deno-rust-cache-rolling-main"
no-git = true
metadata-hints = ["benchmark=deno", "lane=rolling", "layer=compiler"]

[adapters.cargo]
profiles = ["cargo-product"]
compiler-cache = "sccache"
no-git = true
metadata-hints = ["benchmark=deno", "lane=cargo-product"]
command = [
  "cargo", "build", "-Zbuild-std=core,alloc,std,proc_macro,panic_abort",
  "--release", "--locked",
  "-p", "deno",
  "-p", "denort",
  "-p", "test_server",
  "--bin", "deno",
  "--bin", "denort",
  "--bin", "test_server",
  "--features=deno/panic-trace-frame-pointer",
]
