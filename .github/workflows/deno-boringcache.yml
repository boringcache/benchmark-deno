name: "Deno release proof - BoringCache"

on:
  workflow_call:
    inputs:
      cli_version:
        description: Optional BoringCache CLI release tag for canary runs.
        required: false
        type: string
        default: ""
      benchmark_id:
        required: false
        type: string
        default: deno-release-rust-cache
      build_profile:
        required: false
        type: string
        default: release
      strategy:
        required: false
        type: string
        default: boringcache
      cache_profile:
        required: false
        type: string
        default: cargo
      cache_mode:
        required: false
        type: string
        default: sccache
      cache_components:
        required: false
        type: string
        default: cargo-registry,remote-sccache

permissions:
  actions: read
  contents: read

env:
  BENCHMARK_ID: ${{ inputs.benchmark_id }}
  BENCHMARK_WORKSPACE: ${{ github.repository }}
  DENO_BENCHMARK_PROFILE: ${{ inputs.build_profile }}

jobs:
  seed-base:
    name: Base build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      tags_csv: ${{ steps.tags.outputs.tags_csv }}
      sccache_tag: ${{ steps.tags.outputs.sccache_tag }}
    steps:
      - name: Validate BoringCache secrets
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
        run: |
          [[ -n "$BORINGCACHE_RESTORE_TOKEN" ]] || { echo "Missing BoringCache restore token" >&2; exit 1; }
          [[ -n "$BORINGCACHE_SAVE_TOKEN" ]] || { echo "Missing BoringCache save token" >&2; exit 1; }

      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Read pinned source
        id: source
        run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Deno source
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.source.outputs.DENO_SOURCE_REPOSITORY }}
          ref: ${{ steps.source.outputs.DENO_HEAD_SHA }}
          path: upstream
          fetch-depth: 2
          submodules: false

      - name: Prepare base source
        run: ./scripts/prepare-source.sh base

      - name: Install Deno snapshot minifier runtime
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ steps.source.outputs.DENO_RUST_VERSION }}

      - name: Scope cache tags to this proof run
        run: ./scripts/scope-boringcache-run.sh "r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"

      - name: Free runner disk space
        run: ./scripts/free-runner-disk.sh

      - name: Start cache setup timing
        id: cache_start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Configure BoringCache Rust compiler cache
        id: cache
        uses: boringcache/one@bf810e34331db84f9f11930e83b8813b5ad31ba1 # v1.16.4
        with:
          setup: none
          cli-version: ${{ inputs.cli_version }}
          mode: sccache
          trust-policy: publish
          working-directory: .
          cache-profiles: ${{ inputs.cache_profile }}
          sccache-version: 0.16.0
          verify: wait
          diagnostics: verbose
          metadata-hints: |
            benchmark=${{ inputs.benchmark_id }}
            phase=base
          fail-on-cache-error: true
          verbose: true
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}

      - name: Capture cache setup timing
        id: cache_timing
        run: echo "seconds=$(( $(date +%s) - ${{ steps.cache_start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

      - name: Capture cache tags
        id: tags
        run: |
          resolved_tags="${{ steps.cache.outputs.resolved-tags }}"
          [[ -n "$resolved_tags" ]] || { echo "BoringCache did not resolve cache tags" >&2; exit 1; }
          sccache_tag=""
          IFS=',' read -r -a tags <<< "$resolved_tags"
          for tag in "${tags[@]}"; do
            [[ "$tag" == deno-rust-cache-* ]] && sccache_tag="$tag"
          done
          [[ -n "$sccache_tag" ]] || { echo "Could not identify the exact sccache tag in: $resolved_tags" >&2; exit 1; }
          echo "tags_csv=${resolved_tags}" >> "$GITHUB_OUTPUT"
          echo "sccache_tag=${sccache_tag}" >> "$GITHUB_OUTPUT"

      - name: Configure Deno Linux build environment
        run: ./scripts/setup-deno-linux.sh

      - name: Build pinned base commit
        id: build
        run: |
          sccache --zero-stats >/dev/null 2>&1 || true
          started_at="$(date +%s)"
          ./scripts/run-deno-build.sh
          finished_at="$(date +%s)"
          seconds="$((finished_at - started_at))"
          echo "seconds=${seconds}" >> "$GITHUB_OUTPUT"
          sccache --show-stats | tee /tmp/deno-base-sccache-stats.txt

      - name: Require release ThinLTO seed state
        if: inputs.cache_profile == 'release-hybrid'
        run: |
          [[ -d upstream/target/release/lto-cache ]] || { echo "Deno did not create the ThinLTO cache" >&2; exit 1; }
          [[ -n "$(find upstream/target/release/lto-cache -type f -print -quit)" ]] || { echo "Deno created an empty ThinLTO cache" >&2; exit 1; }

      - name: Write base result
        run: |
          end_to_end="$(( ${{ steps.cache_timing.outputs.seconds }} + ${{ steps.build.outputs.seconds }} ))"
          ./scripts/write_phase_result.py \
            --benchmark "$BENCHMARK_ID" \
            --strategy "${{ inputs.strategy }}" \
            --build-profile "$DENO_BENCHMARK_PROFILE" \
            --phase base \
            --source-sha "${{ steps.source.outputs.DENO_BASE_SHA }}" \
            --restore-seconds "${{ steps.cache_timing.outputs.seconds }}" \
            --build-seconds "${{ steps.build.outputs.seconds }}" \
            --end-to-end-seconds "$end_to_end" \
            --cache-key "${{ steps.tags.outputs.tags_csv }}" \
            --cache-mode "${{ inputs.cache_mode }}" \
            --cache-components "${{ inputs.cache_components }}" \
            --cache-import-status cold \
            --sccache-stats-file /tmp/deno-base-sccache-stats.txt \
            --require-sccache-evidence \
            --cli-version "${{ inputs.cli_version || 'v1.16.4' }}" \
            --action-sha bf810e34331db84f9f11930e83b8813b5ad31ba1

      - name: Upload base result
        uses: actions/upload-artifact@v6
        with:
          name: phase-${{ env.BENCHMARK_ID }}-${{ inputs.strategy }}-base
          path: benchmark-results/${{ inputs.strategy }}-base.json
          if-no-files-found: error

  rolling-head:
    name: Rolling commit build
    needs: seed-base
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Validate BoringCache restore secret
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
        run: |
          [[ -n "$BORINGCACHE_RESTORE_TOKEN" ]] || { echo "Missing BoringCache restore token" >&2; exit 1; }

      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Read pinned source
        id: source
        run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Deno source
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.source.outputs.DENO_SOURCE_REPOSITORY }}
          ref: ${{ steps.source.outputs.DENO_HEAD_SHA }}
          path: upstream
          fetch-depth: 2
          submodules: false

      - name: Prepare rolling source
        run: ./scripts/prepare-source.sh head

      - name: Install Deno snapshot minifier runtime
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ steps.source.outputs.DENO_RUST_VERSION }}

      - name: Scope cache tags to this proof run
        run: ./scripts/scope-boringcache-run.sh "r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"

      - name: Free runner disk space
        run: ./scripts/free-runner-disk.sh

      - name: Start cache setup timing
        id: cache_start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Restore BoringCache Rust compiler cache
        id: cache
        uses: boringcache/one@bf810e34331db84f9f11930e83b8813b5ad31ba1 # v1.16.4
        with:
          setup: none
          cli-version: ${{ inputs.cli_version }}
          mode: sccache
          trust-policy: restore
          working-directory: .
          cache-profiles: ${{ inputs.cache_profile }}
          sccache-version: 0.16.0
          verify: check
          diagnostics: verbose
          metadata-hints: |
            benchmark=${{ inputs.benchmark_id }}
            phase=rolling
          fail-on-cache-error: true
          fail-on-cache-miss: true
          verbose: true
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}

      - name: Capture cache setup timing
        id: cache_timing
        run: echo "seconds=$(( $(date +%s) - ${{ steps.cache_start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

      - name: Require restored compiler and archive state
        run: |
          [[ "${{ steps.cache.outputs.sccache-hit }}" == "true" ]] || { echo "The run-scoped sccache tag was not restored" >&2; exit 1; }
          if [[ "${{ inputs.cache_profile }}" == "release-hybrid" ]]; then
            [[ -d upstream/target/release/lto-cache ]] || { echo "The release ThinLTO archive was not restored" >&2; exit 1; }
            [[ -n "$(find upstream/target/release/lto-cache -type f -print -quit)" ]] || { echo "The restored release ThinLTO archive was empty" >&2; exit 1; }
          fi

      - name: Measure BoringCache storage
        id: cache_size
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_EXACT_TAGS: ${{ needs.seed-base.outputs.sccache_tag }}
        run: |
          bytes="$(./scripts/sum-boringcache-check-sizes.sh \
            "$BENCHMARK_WORKSPACE" \
            "${{ needs.seed-base.outputs.tags_csv }}")"
          echo "bytes=${bytes}" >> "$GITHUB_OUTPUT"

      - name: Configure Deno Linux build environment
        run: ./scripts/setup-deno-linux.sh

      - name: Build rolling commit
        id: build
        run: |
          sccache --zero-stats >/dev/null 2>&1 || true
          started_at="$(date +%s)"
          ./scripts/run-deno-build.sh
          finished_at="$(date +%s)"
          seconds="$((finished_at - started_at))"
          echo "seconds=${seconds}" >> "$GITHUB_OUTPUT"
          sccache --show-stats | tee /tmp/deno-rolling-sccache-stats.txt

      - name: Capture proxy diagnostics
        if: always()
        run: |
          mkdir -p benchmark-diagnostics
          curl -fsS "http://127.0.0.1:${{ steps.cache.outputs.proxy-port }}/_boringcache/status" \
            -o benchmark-diagnostics/proxy-status.json || true
          proxy_log="${{ steps.cache.outputs.proxy-log-path }}"
          if [[ -n "$proxy_log" && -f "$proxy_log" ]]; then
            cp "$proxy_log" benchmark-diagnostics/
          fi

      - name: Upload proxy diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diagnostics-${{ env.BENCHMARK_ID }}-boringcache-rolling
          path: benchmark-diagnostics
          if-no-files-found: ignore

      - name: Write rolling result
        run: |
          end_to_end="$(( ${{ steps.cache_timing.outputs.seconds }} + ${{ steps.build.outputs.seconds }} ))"
          ./scripts/write_phase_result.py \
            --benchmark "$BENCHMARK_ID" \
            --strategy "${{ inputs.strategy }}" \
            --build-profile "$DENO_BENCHMARK_PROFILE" \
            --phase rolling \
            --source-sha "${{ steps.source.outputs.DENO_HEAD_SHA }}" \
            --restore-seconds "${{ steps.cache_timing.outputs.seconds }}" \
            --build-seconds "${{ steps.build.outputs.seconds }}" \
            --end-to-end-seconds "$end_to_end" \
            --cache-storage-bytes "${{ steps.cache_size.outputs.bytes }}" \
            --cache-key "${{ needs.seed-base.outputs.tags_csv }}" \
            --cache-mode "${{ inputs.cache_mode }}" \
            --cache-components "${{ inputs.cache_components }}" \
            --cache-import-status ok \
            --sccache-stats-file /tmp/deno-rolling-sccache-stats.txt \
            --require-sccache-evidence \
            --cli-version "${{ inputs.cli_version || 'v1.16.4' }}" \
            --action-sha bf810e34331db84f9f11930e83b8813b5ad31ba1

      - name: Upload rolling result
        uses: actions/upload-artifact@v6
        with:
          name: phase-${{ env.BENCHMARK_ID }}-${{ inputs.strategy }}-rolling
          path: benchmark-results/${{ inputs.strategy }}-rolling.json
          if-no-files-found: error
