name: "Deno Cargo benchmark"
run-name: ${{ format('Deno {0} | CLI {1}', inputs.experiment, inputs.cli_version) }}

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: Exact immutable BoringCache CLI release tag.
        required: true
        type: string
        default: v1.16.4
      experiment:
        description: Cargo product workflow to run.
        required: true
        type: choice
        default: cargo-product
        options:
          - cargo-product
          - cargo-rolling-chain
      cache_scope:
        description: Existing Cargo rolling scope; required by cargo-rolling-chain.
        required: false
        type: string
        default: ""
      archive_tag_suffix:
        description: Suffix on an already-published Cargo archive tag.
        required: false
        type: string
        default: ""
      base_sha:
        description: Commit represented by the published target; required by cargo-rolling-chain.
        required: false
        type: string
        default: ""
      head_sha:
        description: Immediate child to build and publish; required by cargo-rolling-chain.
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  cargo-product:
    name: BoringCache Cargo product proof
    if: ${{ inputs.experiment == 'cargo-product' }}
    uses: ./.github/workflows/deno-cargo-product.yml
    with:
      cli_version: ${{ inputs.cli_version }}
    secrets: inherit

  cargo-rolling-chain:
    name: BoringCache Cargo rolling chain
    if: ${{ inputs.experiment == 'cargo-rolling-chain' }}
    uses: ./.github/workflows/deno-cargo-rolling-chain.yml
    with:
      cli_version: ${{ inputs.cli_version }}
      cache_scope: ${{ inputs.cache_scope }}
      archive_tag_suffix: ${{ inputs.archive_tag_suffix }}
      base_sha: ${{ inputs.base_sha }}
      head_sha: ${{ inputs.head_sha }}
    secrets: inherit
