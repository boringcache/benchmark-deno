name: "Deno Rust cache proof"
run-name: ${{ inputs.cli_version == '' && format('Deno {0} cache proof', inputs.experiment) || format('Deno {0} cache proof | CLI {1}', inputs.experiment, inputs.cli_version) }}

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: Optional BoringCache CLI release tag for a canary run.
        required: false
        type: string
        default: ""
      experiment:
        description: Cache experiment to run.
        required: true
        type: choice
        default: release-hybrid
        options:
          - release-hybrid
          - debug
          - release-sccache
          - release-full-target
          - debug-full-target
          - cargo-archive-chunks
      cargo_seed_sccache_run_id:
        description: Optional run whose BoringCache/mise base sccache entries seed the rolling comparison.
        required: false
        type: string
        default: ""

permissions:
  actions: write
  contents: read

jobs:
  actions-cache:
    name: Actions cache baseline
    if: ${{ !endsWith(inputs.experiment, '-full-target') && inputs.experiment != 'cargo-archive-chunks' }}
    uses: ./.github/workflows/deno-actions-cache.yml
    with:
      benchmark_id: ${{ inputs.experiment == 'debug' && 'deno-debug-rust-cache' || 'deno-release-rust-cache' }}
      build_profile: ${{ inputs.experiment == 'debug' && 'debug' || 'release' }}
      cli_version: ${{ inputs.cli_version || 'v1.15.0' }}
    secrets: inherit

  boringcache:
    name: BoringCache candidate
    if: ${{ !endsWith(inputs.experiment, '-full-target') && inputs.experiment != 'cargo-archive-chunks' }}
    uses: ./.github/workflows/deno-boringcache.yml
    with:
      benchmark_id: ${{ inputs.experiment == 'debug' && 'deno-debug-rust-cache' || 'deno-release-rust-cache' }}
      build_profile: ${{ inputs.experiment == 'debug' && 'debug' || 'release' }}
      strategy: ${{ inputs.experiment == 'release-hybrid' && 'boringcache-hybrid' || 'boringcache' }}
      cache_profile: ${{ inputs.experiment == 'release-hybrid' && 'release-hybrid' || 'cargo' }}
      cache_mode: ${{ inputs.experiment == 'release-hybrid' && 'sccache-plus-lto-archive' || 'sccache' }}
      cache_components: ${{ inputs.experiment == 'release-hybrid' && 'cargo-registry,remote-sccache,release-thinlto-archive' || 'cargo-registry,remote-sccache' }}
      cli_version: ${{ inputs.cli_version }}
    secrets: inherit

  boringcache-full-target:
    name: BoringCache full target plus sccache
    if: ${{ endsWith(inputs.experiment, '-full-target') }}
    uses: ./.github/workflows/deno-boringcache-full-target.yml
    with:
      benchmark_id: ${{ startsWith(inputs.experiment, 'debug-') && 'deno-debug-rust-cache' || 'deno-release-rust-cache' }}
      build_profile: ${{ startsWith(inputs.experiment, 'debug-') && 'debug' || 'release' }}
      source_run_id: ${{ startsWith(inputs.experiment, 'debug-') && '30333410651' || '30333408848' }}
      source_run_attempt: "1"
      cli_version: ${{ inputs.cli_version }}
    secrets: inherit

  cargo-archive-chunks:
    name: BoringCache Cargo chunks vs monolith
    if: ${{ inputs.experiment == 'cargo-archive-chunks' }}
    uses: ./.github/workflows/deno-cargo-archive-chunks.yml
    with:
      cli_version: ${{ inputs.cli_version }}
      source_run_id: ${{ inputs.cargo_seed_sccache_run_id || '30333408848' }}
    secrets: inherit

  compare:
    name: Compare results
    if: ${{ !endsWith(inputs.experiment, '-full-target') && inputs.experiment != 'cargo-archive-chunks' }}
    needs: [actions-cache, boringcache]
    runs-on: ubuntu-24.04
    env:
      BENCHMARK_ID: ${{ inputs.experiment == 'debug' && 'deno-debug-rust-cache' || 'deno-release-rust-cache' }}
      CANDIDATE_STRATEGY: ${{ inputs.experiment == 'release-hybrid' && 'boringcache-hybrid' || 'boringcache' }}
      COMPARISON_TITLE: ${{ inputs.experiment == 'debug' && 'Deno Linux debug cache proof' || (inputs.experiment == 'release-hybrid' && 'Deno release hybrid cache proof' || 'Deno release Rust cache proof') }}
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Download phase results
        uses: actions/download-artifact@v8
        with:
          pattern: phase-${{ env.BENCHMARK_ID }}-*
          path: benchmark-phases
          merge-multiple: true

      - name: Render comparison
        run: |
          ./scripts/render_comparison.py \
            --input-dir benchmark-phases \
            --output-dir benchmark-results \
            --benchmark "$BENCHMARK_ID" \
            --candidate-strategy "$CANDIDATE_STRATEGY" \
            --title "$COMPARISON_TITLE"

      - name: Publish job summary
        run: cat benchmark-results/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ env.BENCHMARK_ID }}-comparison
          path: benchmark-results
          if-no-files-found: error
