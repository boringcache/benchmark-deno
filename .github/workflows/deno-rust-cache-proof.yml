name: "Deno Cargo benchmark"
run-name: ${{ format('Deno {0}', inputs.experiment || 'cargo-rolling-chain') }}

on:
  push:
    branches:
      - main
    paths:
      - "benchmark-source.env"
  workflow_dispatch:
    inputs:
      cli_version:
        description: Exact immutable BoringCache CLI release tag.
        required: false
        type: string
        default: v1.16.5
      experiment:
        description: Cargo product workflow to run.
        required: true
        type: choice
        default: cargo-product
        options:
          - cargo-product
          - cargo-rolling-chain
      cache_scope:
        description: Existing Cargo rolling scope; required by cargo-rolling-chain.
        required: false
        type: string
        default: ""
      base_sha:
        description: Commit represented by the published target; required by cargo-rolling-chain.
        required: false
        type: string
        default: ""
      head_sha:
        description: Immediate child to build and publish; required by cargo-rolling-chain.
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  source:
    name: Read benchmark source
    runs-on: ubuntu-24.04
    outputs:
      base_sha: ${{ steps.source.outputs.DENO_BASE_SHA }}
      head_sha: ${{ steps.source.outputs.DENO_HEAD_SHA }}
      cache_scope: ${{ steps.source.outputs.DENO_ROLLING_CACHE_SCOPE }}
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Read pinned source
        id: source
        run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"

  cargo-product:
    name: BoringCache Cargo product
    needs: source
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.experiment == 'cargo-product' }}
    uses: ./.github/workflows/deno-cargo-product.yml
    with:
      cli_version: ${{ inputs.cli_version }}
    secrets: inherit

  cargo-rolling-chain:
    name: BoringCache Cargo rolling chain
    needs: source
    if: ${{ github.event_name == 'push' || inputs.experiment == 'cargo-rolling-chain' }}
    uses: ./.github/workflows/deno-cargo-rolling-chain.yml
    with:
      cli_version: ${{ inputs.cli_version || 'v1.16.5' }}
      cache_scope: ${{ github.event_name == 'push' && needs.source.outputs.cache_scope || inputs.cache_scope }}
      base_sha: ${{ github.event_name == 'push' && needs.source.outputs.base_sha || inputs.base_sha }}
      head_sha: ${{ github.event_name == 'push' && needs.source.outputs.head_sha || inputs.head_sha }}
    secrets: inherit
