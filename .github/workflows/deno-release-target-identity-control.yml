name: "Deno release target identity control"
run-name: "Deno target identity control | CLI ${{ inputs.cli_version }}"

on:
  workflow_dispatch:
    inputs:
      archive_run_id:
        description: Full-target proof run that owns the promoted BoringCache archive.
        required: true
        default: "30468773381"
        type: string
      archive_run_attempt:
        required: true
        default: "1"
        type: string
      actions_run_id:
        description: Source proof run that owns the paired Actions baseline.
        required: true
        default: "30455349203"
        type: string
      actions_run_attempt:
        required: true
        default: "1"
        type: string
      cli_version:
        required: true
        default: "v1.16.3"
        type: string

permissions:
  actions: read
  contents: read

env:
  BENCHMARK_ID: deno-release-rust-cache
  BENCHMARK_WORKSPACE: ${{ github.repository }}
  DENO_BENCHMARK_PROFILE: release

jobs:
  target-only:
    name: Restore promoted target without sccache
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Validate BoringCache restore secret
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
        run: |
          [[ -n "$BORINGCACHE_RESTORE_TOKEN" ]] || { echo "Missing BoringCache restore token" >&2; exit 1; }

      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Read pinned source
        id: source
        run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Deno rolling source
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.source.outputs.DENO_SOURCE_REPOSITORY }}
          ref: ${{ steps.source.outputs.DENO_HEAD_SHA }}
          path: upstream
          fetch-depth: 2
          submodules: false

      - name: Prepare rolling source
        run: ./scripts/prepare-source.sh head

      - name: Install Deno snapshot minifier runtime
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ steps.source.outputs.DENO_RUST_VERSION }}

      - name: Free runner disk space
        run: ./scripts/free-runner-disk.sh

      - name: Configure Deno Linux build environment
        run: ./scripts/setup-deno-linux.sh

      - name: Select the exact promoted archive
        run: |
          ./scripts/scope-boringcache-run.sh \
            "r${{ inputs.archive_run_id }}-a${{ inputs.archive_run_attempt }}" \
            "r${{ inputs.actions_run_id }}-a${{ inputs.actions_run_attempt }}"

      - name: Start cache restore timing
        id: cache_start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Prepare exact Cargo bin restore destination
        run: |
          mkdir -p "${HOME}/.cargo/bin"
          find "${HOME}/.cargo/bin" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

      - name: Restore the promoted target archive
        id: cache
        uses: boringcache/one@b1d1e466317cde2d78a86f8cb94347deebb501e9 # v1.16.3
        with:
          setup: none
          cli-version: ${{ inputs.cli_version }}
          mode: archive
          trust-policy: restore
          working-directory: .
          cache-profiles: full-target
          verify: check
          diagnostics: verbose
          metadata-hints: |
            benchmark=deno-release-rust-cache
            phase=target-only-control
            archive_run=${{ inputs.archive_run_id }}
          fail-on-cache-error: true
          fail-on-cache-miss: true
          verbose: true
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}

      - name: Require the target and no compiler wrapper
        run: |
          [[ -d upstream/target/release ]] || { echo "The full target archive is missing release" >&2; exit 1; }
          [[ -x upstream/target/release/deno ]] || { echo "The full target archive is missing the Deno binary" >&2; exit 1; }
          [[ -z "${RUSTC_WRAPPER:-}" ]] || { echo "Target-only control inherited RUSTC_WRAPPER=${RUSTC_WRAPPER}" >&2; exit 1; }

      - name: Apply Deno mtime cache
        run: |
          test -s upstream/target/.mtime-cache-db.json
          cp upstream/target/.mtime-cache-db.json /tmp/deno-mtime-cache-before.json
          node ./scripts/run-deno-mtime-cache.js ./upstream |
            tee /tmp/deno-mtime-cache.log

      - name: Capture cache restore timing
        id: cache_timing
        run: echo "seconds=$(( $(date +%s) - ${{ steps.cache_start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

      - name: Measure BoringCache archive storage
        id: cache_size
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
        run: |
          bytes="$(./scripts/sum-boringcache-check-sizes.sh \
            "$BENCHMARK_WORKSPACE" \
            "${{ steps.cache.outputs.resolved-tags }}")"
          echo "bytes=${bytes}" >> "$GITHUB_OUTPUT"

      - name: Build rolling commit without sccache
        id: build
        env:
          DENO_CARGO_EVIDENCE_FILE: /tmp/deno-target-only-cargo.jsonl
        run: |
          unset RUSTC_WRAPPER
          started_at="$(date +%s)"
          ./scripts/run-deno-build.sh
          finished_at="$(date +%s)"
          echo "seconds=$((finished_at - started_at))" >> "$GITHUB_OUTPUT"

      - name: Verify restored mtimes and Cargo freshness
        run: |
          ./scripts/verify_restored_freshness.py \
            --source-root upstream \
            --mtime-before /tmp/deno-mtime-cache-before.json \
            --mtime-after upstream/target/.mtime-cache-db.json \
            --mtime-log /tmp/deno-mtime-cache.log \
            --cargo-messages /tmp/deno-target-only-cargo.jsonl \
            --output benchmark-results/deno-target-only-freshness.json

      - name: Write rolling result
        run: |
          end_to_end="$(( ${{ steps.cache_timing.outputs.seconds }} + ${{ steps.build.outputs.seconds }} ))"
          ./scripts/write_phase_result.py \
            --benchmark "$BENCHMARK_ID" \
            --strategy boringcache-target-only \
            --build-profile "$DENO_BENCHMARK_PROFILE" \
            --phase rolling \
            --source-sha "${{ steps.source.outputs.DENO_HEAD_SHA }}" \
            --restore-seconds "${{ steps.cache_timing.outputs.seconds }}" \
            --build-seconds "${{ steps.build.outputs.seconds }}" \
            --end-to-end-seconds "$end_to_end" \
            --cache-storage-bytes "${{ steps.cache_size.outputs.bytes }}" \
            --cache-key "${{ steps.cache.outputs.resolved-tags }}" \
            --cache-mode promoted-full-target-archive \
            --cache-components actions-cargo-paths,full-target-directory \
            --cache-import-status hit \
            --freshness-evidence-file benchmark-results/deno-target-only-freshness.json \
            --require-freshness-evidence \
            --cli-version "${{ inputs.cli_version }}" \
            --action-sha b1d1e466317cde2d78a86f8cb94347deebb501e9

      - name: Upload target-only result
        uses: actions/upload-artifact@v6
        with:
          name: phase-${{ env.BENCHMARK_ID }}-boringcache-target-only-rolling
          path: |
            benchmark-results/boringcache-target-only-rolling.json
            benchmark-results/deno-target-only-freshness.json
          if-no-files-found: error

  compare:
    name: Compare target-only control with Actions baseline
    needs: target-only
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Download target-only result
        uses: actions/download-artifact@v8
        with:
          pattern: phase-${{ env.BENCHMARK_ID }}-boringcache-target-only-rolling
          path: benchmark-results
          merge-multiple: true

      - name: Download paired Actions rolling result
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.actions_run_id }}
          pattern: phase-${{ env.BENCHMARK_ID }}-actions-cache-rolling
          path: benchmark-results
          merge-multiple: true

      - name: Render control comparison
        run: |
          ./scripts/compare_rolling_controls.py \
            --baseline benchmark-results/actions-cache-rolling.json \
            --candidate benchmark-results/boringcache-target-only-rolling.json \
            --output-dir benchmark-results/control \
            --title "Deno release target identity control"

      - name: Publish job summary
        run: cat benchmark-results/control/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload control comparison
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ env.BENCHMARK_ID }}-target-identity-control
          path: benchmark-results/control
          if-no-files-found: error
