name: "Deno release proof - Actions cache"

on:
  workflow_call:
    inputs:
      benchmark_id:
        required: false
        type: string
        default: deno-release-rust-cache
      build_profile:
        required: false
        type: string
        default: release
      cli_version:
        required: false
        type: string
        default: v1.16.4

permissions:
  actions: write
  contents: read

env:
  BENCHMARK_ID: ${{ inputs.benchmark_id }}
  DENO_BENCHMARK_PROFILE: ${{ inputs.build_profile }}

jobs:
  seed-base:
    name: Base build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      cargo_key: ${{ steps.keys.outputs.cargo_key }}
      target_key: ${{ steps.keys.outputs.target_key }}
      cache_storage_bytes: ${{ steps.cache_size.outputs.bytes }}
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Read pinned source
        id: source
        run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Deno source
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.source.outputs.DENO_SOURCE_REPOSITORY }}
          ref: ${{ steps.source.outputs.DENO_HEAD_SHA }}
          path: upstream
          fetch-depth: 2
          submodules: false

      - name: Prepare base source
        run: ./scripts/prepare-source.sh base

      - name: Install Deno snapshot minifier runtime
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: Free runner disk space
        run: ./scripts/free-runner-disk.sh

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ steps.source.outputs.DENO_RUST_VERSION }}

      - name: Configure Deno Linux build environment
        run: ./scripts/setup-deno-linux.sh

      - name: Define cache keys
        id: keys
        run: |
          scope="gha-${BENCHMARK_ID}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          echo "cargo_key=${scope}-cargo-base" >> "$GITHUB_OUTPUT"
          echo "target_key=${scope}-target-base" >> "$GITHUB_OUTPUT"

      - name: Prepare Actions cache write probe
        run: |
          mkdir -p .cache-write-probe
          echo "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > .cache-write-probe/probe.txt

      - name: Verify Actions cache write access
        id: cache_write_probe
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          key: write-probe-${{ env.BENCHMARK_ID }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: .cache-write-probe

      - name: Fail before building if Actions cache is read-only
        if: steps.cache_write_probe.outcome != 'success'
        run: |
          echo "Actions cache writes are unavailable; a target-cache comparison would be invalid." >&2
          exit 1

      - name: Apply Deno mtime cache
        run: node ./scripts/run-deno-mtime-cache.js ./upstream

      - name: Build pinned base commit
        id: build
        run: |
          started_at="$(date +%s)"
          ./scripts/run-deno-build.sh
          finished_at="$(date +%s)"
          seconds="$((finished_at - started_at))"
          echo "seconds=${seconds}" >> "$GITHUB_OUTPUT"

      - name: Save Cargo home
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.keys.outputs.cargo_key }}
          path: |
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db

      - name: Save Deno target archive
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.keys.outputs.target_key }}
          path: |
            upstream/target
            !upstream/target/*/gn_out
            !upstream/target/*/gn_root
            !upstream/target/*/*.zip
            !upstream/target/*/*.tar.gz

      - name: Measure Actions cache storage
        id: cache_size
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="gha-${BENCHMARK_ID}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          bytes=0
          for _ in $(seq 1 15); do
            bytes="$(./scripts/sum-gha-cache-by-key.sh "$prefix")"
            if [[ "$bytes" =~ ^[0-9]+$ ]] && (( bytes > 0 )); then
              break
            fi
            sleep 2
          done
          if [[ ! "$bytes" =~ ^[0-9]+$ ]] || (( bytes == 0 )); then
            echo "Actions cache storage was still unavailable after 30 seconds" >&2
            exit 1
          fi
          echo "bytes=${bytes}" >> "$GITHUB_OUTPUT"

      - name: Write base result
        run: |
          ./scripts/write_phase_result.py \
            --benchmark "$BENCHMARK_ID" \
            --strategy actions-cache \
            --build-profile "$DENO_BENCHMARK_PROFILE" \
            --phase base \
            --source-sha "${{ steps.source.outputs.DENO_BASE_SHA }}" \
            --restore-seconds 0 \
            --build-seconds "${{ steps.build.outputs.seconds }}" \
            --end-to-end-seconds "${{ steps.build.outputs.seconds }}" \
            --cache-storage-bytes "${{ steps.cache_size.outputs.bytes }}" \
            --cache-key "${{ steps.keys.outputs.target_key }}" \
            --cache-mode target-archive \
            --cache-components cargo-registry,target-directory \
            --cache-import-status cold \
            --cli-version "${{ inputs.cli_version }}" \
            --action-sha bf810e34331db84f9f11930e83b8813b5ad31ba1

      - name: Upload base result
        uses: actions/upload-artifact@v6
        with:
          name: phase-${{ env.BENCHMARK_ID }}-actions-cache-base
          path: benchmark-results/actions-cache-base.json
          if-no-files-found: error

  rolling-head:
    name: Rolling commit build
    needs: seed-base
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Read pinned source
        id: source
        run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Deno source
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.source.outputs.DENO_SOURCE_REPOSITORY }}
          ref: ${{ steps.source.outputs.DENO_HEAD_SHA }}
          path: upstream
          fetch-depth: 2
          submodules: false

      - name: Prepare rolling source
        run: ./scripts/prepare-source.sh head

      - name: Install Deno snapshot minifier runtime
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: Free runner disk space
        run: ./scripts/free-runner-disk.sh

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ steps.source.outputs.DENO_RUST_VERSION }}

      - name: Configure Deno Linux build environment
        run: ./scripts/setup-deno-linux.sh

      - name: Start restore timing
        id: restore_start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo home
        id: restore_cargo
        uses: actions/cache/restore@v5
        with:
          key: ${{ needs.seed-base.outputs.cargo_key }}
          path: |
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          fail-on-cache-miss: true

      - name: Restore Deno target archive
        id: restore_target
        uses: actions/cache/restore@v5
        with:
          key: ${{ needs.seed-base.outputs.target_key }}
          path: |
            upstream/target
            !upstream/target/*/gn_out
            !upstream/target/*/gn_root
            !upstream/target/*/*.zip
            !upstream/target/*/*.tar.gz
          fail-on-cache-miss: true

      - name: Apply Deno mtime cache
        run: node ./scripts/run-deno-mtime-cache.js ./upstream

      - name: Capture restore timing
        id: restore
        run: |
          seconds="$(( $(date +%s) - ${{ steps.restore_start.outputs.started_at }} ))"
          echo "seconds=${seconds}" >> "$GITHUB_OUTPUT"

      - name: Build rolling commit
        id: build
        run: |
          started_at="$(date +%s)"
          ./scripts/run-deno-build.sh
          finished_at="$(date +%s)"
          seconds="$((finished_at - started_at))"
          echo "seconds=${seconds}" >> "$GITHUB_OUTPUT"

      - name: Write rolling result
        run: |
          end_to_end="$(( ${{ steps.restore.outputs.seconds }} + ${{ steps.build.outputs.seconds }} ))"
          ./scripts/write_phase_result.py \
            --benchmark "$BENCHMARK_ID" \
            --strategy actions-cache \
            --build-profile "$DENO_BENCHMARK_PROFILE" \
            --phase rolling \
            --source-sha "${{ steps.source.outputs.DENO_HEAD_SHA }}" \
            --restore-seconds "${{ steps.restore.outputs.seconds }}" \
            --build-seconds "${{ steps.build.outputs.seconds }}" \
            --end-to-end-seconds "$end_to_end" \
            --cache-storage-bytes "${{ needs.seed-base.outputs.cache_storage_bytes }}" \
            --cache-key "${{ steps.restore_target.outputs.cache-matched-key }}" \
            --cache-mode target-archive \
            --cache-components cargo-registry,target-directory \
            --cache-import-status hit \
            --cli-version "${{ inputs.cli_version }}" \
            --action-sha bf810e34331db84f9f11930e83b8813b5ad31ba1

      - name: Upload rolling result
        uses: actions/upload-artifact@v6
        with:
          name: phase-${{ env.BENCHMARK_ID }}-actions-cache-rolling
          path: benchmark-results/actions-cache-rolling.json
          if-no-files-found: error
