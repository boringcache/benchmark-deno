name: "Deno Cargo rolling chain"
run-name: Deno Cargo rolling ${{ inputs.base_sha }} to ${{ inputs.head_sha }}

on:
  workflow_call:
    inputs:
      cache_scope:
        description: Existing rolling scope whose target was published from base_sha.
        required: true
        type: string
      archive_tag_suffix:
        description: Suffix on the already-published archive tags, such as -chunks.
        required: false
        type: string
        default: ""
      base_sha:
        description: Source commit currently represented by the published target.
        required: true
        type: string
      head_sha:
        description: Immediate child commit to build and publish as the next seed.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      cache_scope:
        description: Existing rolling scope whose target was published from base_sha.
        required: true
        type: string
      archive_tag_suffix:
        description: Suffix on the already-published archive tags, such as -chunks.
        required: false
        type: string
        default: ""
      base_sha:
        description: Source commit currently represented by the published target.
        required: true
        type: string
      head_sha:
        description: Immediate child commit to build and publish as the next seed.
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: benchmark-deno-cargo-rolling-chain
  cancel-in-progress: false

env:
  BENCHMARK_WORKSPACE: boringcache/benchmark-deno
  BORINGCACHE_ARCHIVE_GRAPH_WRITES: "1"
  DENO_BENCHMARK_PROFILE: release

jobs:
  advance:
    name: Restore published base and promote adjacent head
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Validate BoringCache secrets
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
        run: |
          [[ -n "$BORINGCACHE_RESTORE_TOKEN" ]] || { echo "Missing BoringCache restore token" >&2; exit 1; }
          [[ -n "$BORINGCACHE_SAVE_TOKEN" ]] || { echo "Missing BoringCache save token" >&2; exit 1; }

      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Read pinned toolchain
        id: source
        run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"

      - name: Checkout adjacent Deno head
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.source.outputs.DENO_SOURCE_REPOSITORY }}
          ref: ${{ inputs.head_sha }}
          path: upstream
          fetch-depth: 2
          submodules: false

      - name: Require one-commit source cadence
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "${{ inputs.head_sha }}"
          test "$(git -C upstream rev-parse HEAD^)" = "${{ inputs.base_sha }}"
          git -C upstream clean -fdx
          test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"

      - name: Install Deno snapshot minifier runtime
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "${{ steps.source.outputs.DENO_RUST_VERSION }}" --profile minimal
          rustup default "${{ steps.source.outputs.DENO_RUST_VERSION }}"

      - name: Free runner disk space
        run: ./scripts/free-runner-disk.sh

      - name: Configure Deno Linux build environment
        run: ./scripts/setup-deno-linux.sh

      - name: Install exact sccache
        run: ./scripts/install-sccache.sh 0.16.0

      - name: Scope the persistent Cargo product chain
        run: |
          ./scripts/scope-boringcache-run.sh \
            "${{ inputs.cache_scope }}" \
            "${{ inputs.cache_scope }}" \
            "${{ inputs.archive_tag_suffix }}" \
            ""

      - name: Resolve the published base through BoringCache One
        id: base_action
        uses: boringcache/one@09e053620cda4d3472f26a3ddd181144a108e2c2 # v1.16.8
        with:
          trust-policy: restore
          setup: none
          mode: cargo
          working-directory: upstream
          lookup-only: true
          fail-on-cache-miss: true
          fail-on-cache-error: true
          metadata-hints: phase=rolling-chain-base
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}

      - name: Require the published base target and sccache seed
        id: base
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
        run: |
          set -euo pipefail
          test ! -e upstream/target
          test "${{ steps.base_action.outputs.cache-hit }}" = "true"
          cp "${{ steps.base_action.outputs.evidence-path }}" /tmp/deno-chain-base-action.json
          target_tag_raw="deno-cargo-target-${{ inputs.cache_scope }}${{ inputs.archive_tag_suffix }}"
          boringcache check "$BENCHMARK_WORKSPACE" "$target_tag_raw" --no-git --json \
            | tee /tmp/deno-chain-base-check.json
          target_tag="$(jq -r '.results[] | select(.status == "hit") | .tag' /tmp/deno-chain-base-check.json)"
          [[ -n "$target_tag" ]] || { echo "Published base target did not resolve" >&2; exit 1; }
          boringcache inspect "$BENCHMARK_WORKSPACE" "$target_tag" --json \
            | tee /tmp/deno-chain-base-inspect.json
          jq -e '.entry.status == "ready" and .entry.server_signed and (.entry.storage_mode == "archive" or (.entry.storage_mode == "cas" and .entry.cas_layout == "archive-chunks-v1" and .entry.storage_verified))' \
            /tmp/deno-chain-base-inspect.json
          echo "entry_id=$(jq -r '.entry.id' /tmp/deno-chain-base-inspect.json)" >> "$GITHUB_OUTPUT"

          sccache_tag="deno-rust-cache-${{ inputs.cache_scope }}"
          boringcache check "$BENCHMARK_WORKSPACE" "$sccache_tag" --no-git --json \
            | tee /tmp/deno-chain-sccache-check.json
          jq -e '.results[] | select(.status == "hit" and .kv_entry_count > 0)' \
            /tmp/deno-chain-sccache-check.json

      - name: Restore, build, and publish the adjacent head through BoringCache One
        id: build
        uses: boringcache/one@09e053620cda4d3472f26a3ddd181144a108e2c2 # v1.16.8
        with:
          trust-policy: publish
          setup: none
          mode: cargo
          working-directory: upstream
          fail-on-cache-error: true
          metadata-hints: phase=rolling-chain
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
          CARGO_INCREMENTAL: "0"
          DENO_CANARY: "true"
          DENO_SNAPSHOT_MINIFY_SOURCES: "1"

      - name: Verify Cargo correctness, cache health, and head promotion
        id: proof
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
        run: |
          set -euo pipefail
          test -x upstream/target/release/deno
          test -s upstream/target/.boringcache/cargo-freshness-v2.json
          test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"

          action_evidence="${{ steps.build.outputs.evidence-path }}"
          test -s "$action_evidence"
          cp "$action_evidence" /tmp/deno-chain-action.json
          jq -e '
            .schema_version == "boringcache_one_evidence.v1" and
            .phases.restore.phase_status == "completed" and
            .phases.restore.mode == "cargo" and
            .phases.restore.cache_hit == true and
            .phases.restore.mode_evidence.command_executed == true and
            .phases.restore.mode_evidence.target_cache_hit == true and
            .phases.restore.mode_evidence.native_tool.tool == "sccache" and
            (.phases.restore.mode_evidence.native_tool.cache_read_errors // 0) == 0 and
            (.phases.restore.mode_evidence.native_tool.cache_write_errors // 0) == 0 and
            (.phases.restore.mode_evidence.native_tool.cache_timeouts // 0) == 0
          ' "$action_evidence"

          target_tag_raw="deno-cargo-target-${{ inputs.cache_scope }}${{ inputs.archive_tag_suffix }}"
          boringcache check "$BENCHMARK_WORKSPACE" "$target_tag_raw" --no-git --json \
            | tee /tmp/deno-chain-head-check.json
          target_tag="$(jq -r '.results[] | select(.status == "hit") | .tag' /tmp/deno-chain-head-check.json)"
          boringcache inspect "$BENCHMARK_WORKSPACE" "$target_tag" --json \
            | tee /tmp/deno-chain-head-inspect.json
          jq -e '.entry.status == "ready" and .entry.server_signed and .entry.storage_mode == "cas" and .entry.cas_layout == "archive-chunks-v1" and .entry.storage_verified and .entry.blob_count > 1' \
            /tmp/deno-chain-head-inspect.json
          test "$(jq -r '.entry.id' /tmp/deno-chain-head-inspect.json)" != "${{ steps.base.outputs.entry_id }}"

          elapsed_seconds="$(jq -r '.phases.restore.mode_evidence.elapsed_seconds' "$action_evidence")"
          compile_requests="$(jq -r '.phases.restore.mode_evidence.native_tool.compile_requests // 0' "$action_evidence")"
          cache_hits="$(jq -r '.phases.restore.mode_evidence.native_tool.cache_hits // 0' "$action_evidence")"
          cache_misses="$(jq -r '.phases.restore.mode_evidence.native_tool.cache_misses // 0' "$action_evidence")"

          {
            echo "elapsed_seconds=${elapsed_seconds}"
            echo "compile_requests=${compile_requests}"
            echo "cache_hits=${cache_hits}"
            echo "cache_misses=${cache_misses}"
          } >> "$GITHUB_OUTPUT"

      - name: Record target accumulation
        id: target_growth
        run: |
          set -euo pipefail
          jq -n \
            --slurpfile base /tmp/deno-chain-base-inspect.json \
            --slurpfile head /tmp/deno-chain-head-inspect.json '
              def stored_bytes:
                .stored_size_bytes // .compressed_size // .blob_total_size_bytes;
              def layout_id:
                [
                  .storage_mode,
                  .cas_layout,
                  .compression_algorithm,
                  (if .manifest_format_version == null then null
                   else "manifest-v\(.manifest_format_version)" end)
                ] | map(select(. != null)) | join(":");
              ($base[0].entry) as $before |
              ($head[0].entry) as $after |
              (($before | layout_id) == ($after | layout_id)) as $comparable |
              {
                schema_version: "cargo_target_growth.v1",
                comparable: $comparable,
                reason: (if $comparable then null else "storage_layout_changed" end),
                base: {
                  entry_id: $before.id,
                  layout: ($before | layout_id),
                  storage_mode: $before.storage_mode,
                  cas_layout: ($before.cas_layout // null),
                  compression_algorithm: ($before.compression_algorithm // null),
                  manifest_format_version: ($before.manifest_format_version // null),
                  stored_size_bytes: ($before | stored_bytes),
                  uncompressed_size_bytes: ($before.uncompressed_size // null)
                },
                head: {
                  entry_id: $after.id,
                  layout: ($after | layout_id),
                  storage_mode: $after.storage_mode,
                  cas_layout: ($after.cas_layout // null),
                  compression_algorithm: ($after.compression_algorithm // null),
                  manifest_format_version: ($after.manifest_format_version // null),
                  stored_size_bytes: ($after | stored_bytes),
                  uncompressed_size_bytes: ($after.uncompressed_size // null)
                },
                stored_size_bytes_delta: (
                  if $comparable and (($before | stored_bytes) != null) and (($after | stored_bytes) != null)
                  then ($after | stored_bytes) - ($before | stored_bytes)
                  else null end
                ),
                uncompressed_size_bytes_delta: (
                  if $comparable and ($before.uncompressed_size != null) and ($after.uncompressed_size != null)
                  then $after.uncompressed_size - $before.uncompressed_size
                  else null end
                )
              }
            ' | tee /tmp/deno-chain-target-growth.json

          jq -e '.schema_version == "cargo_target_growth.v1"' /tmp/deno-chain-target-growth.json
          {
            echo "comparable=$(jq -r '.comparable' /tmp/deno-chain-target-growth.json)"
            echo "layout=$(jq -r '.head.layout' /tmp/deno-chain-target-growth.json)"
            echo "stored_before=$(jq -r '.base.stored_size_bytes // "unavailable"' /tmp/deno-chain-target-growth.json)"
            echo "stored_after=$(jq -r '.head.stored_size_bytes // "unavailable"' /tmp/deno-chain-target-growth.json)"
            echo "stored_delta=$(jq -r '.stored_size_bytes_delta // "not-comparable"' /tmp/deno-chain-target-growth.json)"
            echo "uncompressed_before=$(jq -r '.base.uncompressed_size_bytes // "unavailable"' /tmp/deno-chain-target-growth.json)"
            echo "uncompressed_after=$(jq -r '.head.uncompressed_size_bytes // "unavailable"' /tmp/deno-chain-target-growth.json)"
            echo "uncompressed_delta=$(jq -r '.uncompressed_size_bytes_delta // "unavailable"' /tmp/deno-chain-target-growth.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish rolling cadence summary
        run: |
          {
            echo "## Deno Cargo rolling cadence"
            echo
            echo "- Action: \`boringcache/one@09e053620cda4d3472f26a3ddd181144a108e2c2\`"
            echo "- Source: \`${{ inputs.base_sha }}\` → \`${{ inputs.head_sha }}\`"
            echo "- Cargo lifecycle: ${{ steps.proof.outputs.elapsed_seconds }}s"
            echo "- sccache: ${{ steps.proof.outputs.compile_requests }} requests, ${{ steps.proof.outputs.cache_hits }} hits, ${{ steps.proof.outputs.cache_misses }} misses"
            echo "- Target layout: ${{ steps.target_growth.outputs.layout }} (comparable=${{ steps.target_growth.outputs.comparable }})"
            echo "- Target stored bytes: ${{ steps.target_growth.outputs.stored_before }} → ${{ steps.target_growth.outputs.stored_after }} (delta ${{ steps.target_growth.outputs.stored_delta }})"
            echo "- Target uncompressed bytes: ${{ steps.target_growth.outputs.uncompressed_before }} → ${{ steps.target_growth.outputs.uncompressed_after }} (delta ${{ steps.target_growth.outputs.uncompressed_delta }})"
            echo "- The authenticated target selected by the released CLI was advanced in place and is the next rolling seed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rolling evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deno-cargo-rolling-${{ inputs.head_sha }}
          path: |
            /tmp/deno-chain-*.json
          if-no-files-found: error
