name: "Deno full target proof - BoringCache"

on:
  workflow_call:
    inputs:
      cli_version:
        description: Optional BoringCache CLI release tag for canary runs.
        required: false
        type: string
        default: ""
      benchmark_id:
        required: true
        type: string
      build_profile:
        required: true
        type: string
      source_run_id:
        description: Existing proof run whose Actions archives and sccache seed are reused.
        required: true
        type: string
      source_run_attempt:
        required: false
        type: string
        default: "1"

permissions:
  actions: read
  contents: read

env:
  BENCHMARK_ID: ${{ inputs.benchmark_id }}
  BENCHMARK_WORKSPACE: ${{ github.repository }}
  DENO_BENCHMARK_PROFILE: ${{ inputs.build_profile }}
  SOURCE_RUN_ID: ${{ inputs.source_run_id }}
  SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}

jobs:
  promote-seed:
    name: Promote existing full target seed
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      archive_tags: ${{ steps.cache.outputs.resolved-tags }}
      sccache_tag: ${{ steps.tags.outputs.sccache_tag }}
    steps:
      - name: Validate BoringCache secrets
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
        run: |
          [[ -n "$BORINGCACHE_RESTORE_TOKEN" ]] || { echo "Missing BoringCache restore token" >&2; exit 1; }
          [[ -n "$BORINGCACHE_SAVE_TOKEN" ]] || { echo "Missing BoringCache save token" >&2; exit 1; }

      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Read pinned source
        id: source
        run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Deno base source
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.source.outputs.DENO_SOURCE_REPOSITORY }}
          ref: ${{ steps.source.outputs.DENO_BASE_SHA }}
          path: upstream
          fetch-depth: 2
          submodules: false

      - name: Prepare base source
        run: ./scripts/prepare-source.sh base

      - name: Free runner disk space
        run: ./scripts/free-runner-disk.sh

      - name: Scope archive tags and reuse the source sccache tag
        run: |
          ./scripts/scope-boringcache-run.sh \
            "r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}" \
            "r${SOURCE_RUN_ID}-a${SOURCE_RUN_ATTEMPT}"

      - name: Start promotion timing
        id: promotion_start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Restore existing Actions Cargo archive
        uses: actions/cache/restore@v5
        with:
          key: gha-${{ env.BENCHMARK_ID }}-r${{ env.SOURCE_RUN_ID }}-a${{ env.SOURCE_RUN_ATTEMPT }}-cargo-base
          path: |
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          fail-on-cache-miss: true

      - name: Restore existing Actions full target archive
        id: restore_target
        uses: actions/cache/restore@v5
        with:
          key: gha-${{ env.BENCHMARK_ID }}-r${{ env.SOURCE_RUN_ID }}-a${{ env.SOURCE_RUN_ATTEMPT }}-target-base
          path: |
            upstream/target
            !upstream/target/*/gn_out
            !upstream/target/*/gn_root
            !upstream/target/*/*.zip
            !upstream/target/*/*.tar.gz
          fail-on-cache-miss: true

      - name: Require the promoted target state
        run: |
          profile_dir="${DENO_BENCHMARK_PROFILE}"
          [[ -d "upstream/target/${profile_dir}" ]] || { echo "The source target archive is missing ${profile_dir}" >&2; exit 1; }
          [[ -x "upstream/target/${profile_dir}/deno" ]] || { echo "The source target archive is missing the Deno binary" >&2; exit 1; }

      - name: Publish the restored paths to BoringCache
        id: cache
        uses: boringcache/one@b1d1e466317cde2d78a86f8cb94347deebb501e9 # v1.16.3
        with:
          setup: none
          cli-version: ${{ inputs.cli_version }}
          mode: archive
          trust-policy: publish
          working-directory: .
          cache-profiles: full-target
          verify: wait
          diagnostics: verbose
          metadata-hints: |
            benchmark=${{ inputs.benchmark_id }}
            phase=promoted-base
            source_run=${{ inputs.source_run_id }}
          fail-on-cache-error: true
          verbose: true
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}

      - name: Capture promotion evidence
        id: tags
        run: |
          resolved_tags="${{ steps.cache.outputs.resolved-tags }}"
          [[ -n "$resolved_tags" ]] || { echo "BoringCache did not resolve full-target tags" >&2; exit 1; }
          sccache_tag="deno-rust-cache-r${SOURCE_RUN_ID}-a${SOURCE_RUN_ATTEMPT}"
          echo "sccache_tag=${sccache_tag}" >> "$GITHUB_OUTPUT"
          echo "seconds=$(( $(date +%s) - ${{ steps.promotion_start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

      - name: Write promoted base result
        run: |
          cache_key="${{ steps.cache.outputs.resolved-tags }},${{ steps.tags.outputs.sccache_tag }}"
          ./scripts/write_phase_result.py \
            --benchmark "$BENCHMARK_ID" \
            --strategy boringcache-full-target \
            --build-profile "$DENO_BENCHMARK_PROFILE" \
            --phase base \
            --source-sha "${{ steps.source.outputs.DENO_BASE_SHA }}" \
            --restore-seconds "${{ steps.tags.outputs.seconds }}" \
            --build-seconds 0 \
            --end-to-end-seconds "${{ steps.tags.outputs.seconds }}" \
            --cache-key "$cache_key" \
            --cache-mode full-target-archive-plus-sccache \
            --cache-components actions-cargo-paths,full-target-directory,remote-sccache \
            --cache-import-status promoted \
            --cli-version "${{ inputs.cli_version || 'v1.16.3' }}" \
            --action-sha b1d1e466317cde2d78a86f8cb94347deebb501e9

      - name: Upload promoted base result
        uses: actions/upload-artifact@v6
        with:
          name: phase-${{ env.BENCHMARK_ID }}-boringcache-full-target-base
          path: benchmark-results/boringcache-full-target-base.json
          if-no-files-found: error

  rolling-head:
    name: Restore full target plus sccache and build rolling commit
    needs: promote-seed
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Validate BoringCache restore secret
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
        run: |
          [[ -n "$BORINGCACHE_RESTORE_TOKEN" ]] || { echo "Missing BoringCache restore token" >&2; exit 1; }

      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Read pinned source
        id: source
        run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Deno rolling source
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.source.outputs.DENO_SOURCE_REPOSITORY }}
          ref: ${{ steps.source.outputs.DENO_HEAD_SHA }}
          path: upstream
          fetch-depth: 2
          submodules: false

      - name: Prepare rolling source
        run: ./scripts/prepare-source.sh head

      - name: Install Deno snapshot minifier runtime
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ steps.source.outputs.DENO_RUST_VERSION }}

      - name: Free runner disk space
        run: ./scripts/free-runner-disk.sh

      - name: Configure Deno Linux build environment
        run: ./scripts/setup-deno-linux.sh

      - name: Scope archive tags and reuse the source sccache tag
        run: |
          ./scripts/scope-boringcache-run.sh \
            "r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}" \
            "r${SOURCE_RUN_ID}-a${SOURCE_RUN_ATTEMPT}"

      - name: Start cache restore timing
        id: cache_start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Prepare exact Cargo bin restore destination
        run: |
          mkdir -p "${HOME}/.cargo/bin"
          find "${HOME}/.cargo/bin" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

      - name: Restore the full target and remote compiler cache
        id: cache
        uses: boringcache/one@b1d1e466317cde2d78a86f8cb94347deebb501e9 # v1.16.3
        with:
          setup: none
          cli-version: ${{ inputs.cli_version }}
          mode: sccache
          trust-policy: restore
          working-directory: .
          cache-profiles: full-target
          sccache-version: 0.16.0
          verify: check
          diagnostics: verbose
          metadata-hints: |
            benchmark=${{ inputs.benchmark_id }}
            phase=rolling
            source_run=${{ inputs.source_run_id }}
          fail-on-cache-error: true
          fail-on-cache-miss: true
          verbose: true
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}

      - name: Require all restored state
        run: |
          [[ "${{ steps.cache.outputs.sccache-hit }}" == "true" ]] || { echo "The source sccache tag was not restored" >&2; exit 1; }
          profile_dir="${DENO_BENCHMARK_PROFILE}"
          [[ -d "upstream/target/${profile_dir}" ]] || { echo "The full target archive is missing ${profile_dir}" >&2; exit 1; }
          [[ -x "upstream/target/${profile_dir}/deno" ]] || { echo "The full target archive is missing the Deno binary" >&2; exit 1; }

      - name: Apply Deno mtime cache
        run: |
          test -s upstream/target/.mtime-cache-db.json
          cp upstream/target/.mtime-cache-db.json /tmp/deno-mtime-cache-before.json
          node ./scripts/run-deno-mtime-cache.js ./upstream |
            tee /tmp/deno-mtime-cache.log

      - name: Capture cache restore timing
        id: cache_timing
        run: echo "seconds=$(( $(date +%s) - ${{ steps.cache_start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

      - name: Measure BoringCache storage
        id: cache_size
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_EXACT_TAGS: ${{ needs.promote-seed.outputs.sccache_tag }}
        run: |
          bytes="$(./scripts/sum-boringcache-check-sizes.sh \
            "$BENCHMARK_WORKSPACE" \
            "${{ steps.cache.outputs.resolved-tags }}")"
          echo "bytes=${bytes}" >> "$GITHUB_OUTPUT"

      - name: Build rolling commit
        id: build
        env:
          DENO_CARGO_EVIDENCE_FILE: /tmp/deno-full-target-cargo.jsonl
        run: |
          sccache --zero-stats >/dev/null 2>&1 || true
          started_at="$(date +%s)"
          ./scripts/run-deno-build.sh
          finished_at="$(date +%s)"
          seconds="$((finished_at - started_at))"
          echo "seconds=${seconds}" >> "$GITHUB_OUTPUT"
          sccache --show-stats | tee /tmp/deno-full-target-sccache-stats.txt

      - name: Verify restored mtimes and Cargo freshness
        run: |
          ./scripts/verify_restored_freshness.py \
            --source-root upstream \
            --mtime-before /tmp/deno-mtime-cache-before.json \
            --mtime-after upstream/target/.mtime-cache-db.json \
            --mtime-log /tmp/deno-mtime-cache.log \
            --cargo-messages /tmp/deno-full-target-cargo.jsonl \
            --output benchmark-results/deno-full-target-freshness.json

      - name: Write rolling result
        run: |
          end_to_end="$(( ${{ steps.cache_timing.outputs.seconds }} + ${{ steps.build.outputs.seconds }} ))"
          ./scripts/write_phase_result.py \
            --benchmark "$BENCHMARK_ID" \
            --strategy boringcache-full-target \
            --build-profile "$DENO_BENCHMARK_PROFILE" \
            --phase rolling \
            --source-sha "${{ steps.source.outputs.DENO_HEAD_SHA }}" \
            --restore-seconds "${{ steps.cache_timing.outputs.seconds }}" \
            --build-seconds "${{ steps.build.outputs.seconds }}" \
            --end-to-end-seconds "$end_to_end" \
            --cache-storage-bytes "${{ steps.cache_size.outputs.bytes }}" \
            --cache-key "${{ steps.cache.outputs.resolved-tags }}" \
            --cache-mode full-target-archive-plus-sccache \
            --cache-components actions-cargo-paths,full-target-directory,remote-sccache \
            --cache-import-status hit \
            --sccache-stats-file /tmp/deno-full-target-sccache-stats.txt \
            --require-sccache-evidence \
            --freshness-evidence-file benchmark-results/deno-full-target-freshness.json \
            --require-freshness-evidence \
            --cli-version "${{ inputs.cli_version || 'v1.16.3' }}" \
            --action-sha b1d1e466317cde2d78a86f8cb94347deebb501e9

      - name: Upload rolling result
        uses: actions/upload-artifact@v6
        with:
          name: phase-${{ env.BENCHMARK_ID }}-boringcache-full-target-rolling
          path: benchmark-results/boringcache-full-target-rolling.json
          if-no-files-found: error

  compare:
    name: Compare reused Actions baseline with full-target BoringCache
    needs: [promote-seed, rolling-head]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Download BoringCache phase results
        uses: actions/download-artifact@v8
        with:
          pattern: phase-${{ env.BENCHMARK_ID }}-boringcache-full-target-*
          path: benchmark-phases
          merge-multiple: true

      - name: Download existing Actions phase results
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          pattern: phase-${{ env.BENCHMARK_ID }}-actions-cache-*
          path: benchmark-phases
          merge-multiple: true

      - name: Render comparison
        run: |
          ./scripts/render_comparison.py \
            --input-dir benchmark-phases \
            --output-dir benchmark-results \
            --benchmark "$BENCHMARK_ID" \
            --candidate-strategy boringcache-full-target \
            --title "Deno ${DENO_BENCHMARK_PROFILE} full-target plus sccache proof"

      - name: Publish job summary
        run: cat benchmark-results/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ env.BENCHMARK_ID }}-full-target-comparison
          path: benchmark-results
          if-no-files-found: error
