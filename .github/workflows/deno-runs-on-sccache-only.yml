name: Deno RunsOn sccache-only comparison
run-name: Deno sccache without target on RunsOn

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: Optional exact BoringCache CLI release tag.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: deno-runs-on-sccache-only-comparison
  cancel-in-progress: false

jobs:
  magic-cold:
    uses: ./.github/workflows/deno-runs-on-phase.yml
    with:
      provider: runs-on-cache
      phase: cold
      cache_variant: sccache-only

  boringcache-cold:
    uses: ./.github/workflows/deno-runs-on-phase.yml
    with:
      provider: boringcache
      phase: cold
      cache_variant: sccache-only
      cli_version: ${{ inputs.cli_version }}

  magic-warm:
    needs: magic-cold
    uses: ./.github/workflows/deno-runs-on-phase.yml
    with:
      provider: runs-on-cache
      phase: warm
      cache_variant: sccache-only

  boringcache-warm:
    needs: boringcache-cold
    uses: ./.github/workflows/deno-runs-on-phase.yml
    with:
      provider: boringcache
      phase: warm
      cache_variant: sccache-only
      cli_version: ${{ inputs.cli_version }}

  magic-source-change:
    needs: magic-warm
    uses: ./.github/workflows/deno-runs-on-phase.yml
    with:
      provider: runs-on-cache
      phase: source_change
      cache_variant: sccache-only

  boringcache-source-change:
    needs: boringcache-warm
    uses: ./.github/workflows/deno-runs-on-phase.yml
    with:
      provider: boringcache
      phase: source_change
      cache_variant: sccache-only
      cli_version: ${{ inputs.cli_version }}

  report:
    name: Compare cache phases
    needs: [magic-source-change, boringcache-source-change]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          pattern: phase-deno-runson-*
          path: phase-evidence
      - name: Summarize comparable work
        run: |
          python3 ./scripts/benchmark-report.py summarize \
            --title "Deno sccache without target on RunsOn" \
            --baseline-strategy runs-on-cache \
            --no-deltas \
            --input-dir phase-evidence \
            --output-dir benchmark-results
      - uses: actions/upload-artifact@v6
        with:
          name: deno-runson-sccache-only-comparison
          path: benchmark-results/
          if-no-files-found: error
