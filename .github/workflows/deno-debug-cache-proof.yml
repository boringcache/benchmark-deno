name: "Deno Linux debug cache proof"
run-name: ${{ inputs.cli_version == '' && 'Deno Linux debug cache proof' || format('Deno Linux debug cache proof | CLI {0}', inputs.cli_version) }}

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: Optional BoringCache CLI release tag for a canary run.
        required: false
        type: string
        default: ""

permissions:
  actions: write
  contents: read

jobs:
  actions-cache:
    name: Actions full target baseline
    uses: ./.github/workflows/deno-actions-cache.yml
    with:
      benchmark_id: deno-debug-rust-cache
      build_profile: debug
      cli_version: ${{ inputs.cli_version || 'v1.16.2' }}
    secrets: inherit

  boringcache:
    name: BoringCache remote sccache
    uses: ./.github/workflows/deno-boringcache.yml
    with:
      benchmark_id: deno-debug-rust-cache
      build_profile: debug
      strategy: boringcache
      cache_profile: cargo
      cache_mode: sccache
      cache_components: cargo-registry,remote-sccache
      cli_version: ${{ inputs.cli_version }}
    secrets: inherit

  compare:
    name: Compare debug results
    needs: [actions-cache, boringcache]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Download phase results
        uses: actions/download-artifact@v8
        with:
          pattern: phase-deno-debug-rust-cache-*
          path: benchmark-phases
          merge-multiple: true

      - name: Render comparison
        run: |
          ./scripts/render_comparison.py \
            --input-dir benchmark-phases \
            --output-dir benchmark-results \
            --benchmark deno-debug-rust-cache \
            --candidate-strategy boringcache \
            --title "Deno Linux debug cache proof"

      - name: Publish job summary
        run: cat benchmark-results/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-deno-debug-cache-comparison
          path: benchmark-results
          if-no-files-found: error
