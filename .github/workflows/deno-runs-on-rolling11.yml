name: Deno RunsOn 10-commit rolling comparison
run-name: Deno 10 commits (${{ inputs.cache_variant }}) and final same-revision warm run

on:
  workflow_dispatch:
    inputs:
      cache_variant:
        description: Cache profile for both providers.
        required: true
        type: choice
        options: [sccache-only, target, target-sccache]
        default: sccache-only
      cli_version:
        description: Optional exact BoringCache CLI release tag.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: deno-runs-on-rolling11
  cancel-in-progress: false

jobs:
  source:
    name: Resolve ten first-parent source commits
    runs-on: ubuntu-24.04
    outputs:
      shas: ${{ steps.commits.outputs.shas }}
    steps:
      - uses: actions/checkout@v6
      - name: Pin the source sequence
        id: commits
        run: |
          set -euo pipefail
          source benchmark-source.env
          head="$DENO_HEAD_SHA"
          git init "$RUNNER_TEMP/source"
          git -C "$RUNNER_TEMP/source" remote add origin https://github.com/denoland/deno.git
          git -C "$RUNNER_TEMP/source" fetch --no-tags --filter=blob:none --depth=11 origin "$head"
          mapfile -t shas < <(git -C "$RUNNER_TEMP/source" rev-list --first-parent --max-count=10 "$head" | tac)
          test "${#shas[@]}" -eq 10
          test "${shas[9]}" = "$head"
          echo "shas=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1:]))' "${shas[@]}")" >> "$GITHUB_OUTPUT"
          printf "%s\n" "${shas[@]}"

  bucket-before:
    name: Inspect RunsOn cache bucket before builds
    runs-on: ${{ format('runs-on={0}/cpu=16/ram=64/family=m7i.*+m7a/image=ubuntu24-full-x64/volume=300gb:gp3/env=benchmark/region=us-east-1/spot=false/extras=s3-cache', github.run_id) }}
    steps:
      - uses: runs-on/action@efac073ea2507ec18797de3a81704201ade11d9d # v2.3.1
      - uses: actions/checkout@v6
      - name: Summarize cache objects
        run: |
          mkdir -p benchmark-results
          python3 ./scripts/report-runs-on-s3.py before benchmark-results/bucket-before.json
      - uses: actions/upload-artifact@v6
        with:
          name: deno-runson-bucket-before
          path: benchmark-results/bucket-before.json
          if-no-files-found: error

  step00:
    needs: [source, bucket-before]
    strategy:
      fail-fast: false
      matrix:
        provider: [runs-on-cache, boringcache]
    uses: ./.github/workflows/deno-runs-on-phase.yml
    with:
      provider: ${{ matrix.provider }}
      phase: cold
      cache_variant: ${{ inputs.cache_variant }}
      source_sha: ${{ fromJSON(needs.source.outputs.shas)[0] }}
      rolling_step: "00"
      cli_version: ${{ inputs.cli_version }}

  step01:
    needs: [source, step00]
    strategy:
      fail-fast: false
      matrix:
        provider: [runs-on-cache, boringcache]
    uses: ./.github/workflows/deno-runs-on-phase.yml
    with:
      provider: ${{ matrix.provider }}
      phase: source_change
      cache_variant: ${{ inputs.cache_variant }}
      source_sha: ${{ fromJSON(needs.source.outputs.shas)[1] }}
      expected_parent: ${{ fromJSON(needs.source.outputs.shas)[0] }}
      rolling_step: "01"
      rolling_previous: "00"
      cli_version: ${{ inputs.cli_version }}

  step02:
    needs: [source, step01]
    strategy:
      fail-fast: false
      matrix:
        provider: [runs-on-cache, boringcache]
    uses: ./.github/workflows/deno-runs-on-phase.yml
    with:
      provider: ${{ matrix.provider }}
      phase: source_change
      cache_variant: ${{ inputs.cache_variant }}
      source_sha: ${{ fromJSON(needs.source.outputs.shas)[2] }}
      expected_parent: ${{ fromJSON(needs.source.outputs.shas)[1] }}
      rolling_step: "02"
      rolling_previous: "01"
      cli_version: ${{ inputs.cli_version }}

  step03:
    needs: [source, step02]
    strategy:
      fail-fast: false
      matrix:
        provider: [runs-on-cache, boringcache]
    uses: ./.github/workflows/deno-runs-on-phase.yml
    with:
      provider: ${{ matrix.provider }}
      phase: source_change
      cache_variant: ${{ inputs.cache_variant }}
      source_sha: ${{ fromJSON(needs.source.outputs.shas)[3] }}
      expected_parent: ${{ fromJSON(needs.source.outputs.shas)[2] }}
      rolling_step: "03"
      rolling_previous: "02"
      cli_version: ${{ inputs.cli_version }}

  step04:
    needs: [source, step03]
    strategy:
      fail-fast: false
      matrix:
        provider: [runs-on-cache, boringcache]
    uses: ./.github/workflows/deno-runs-on-phase.yml
    with:
      provider: ${{ matrix.provider }}
      phase: source_change
      cache_variant: ${{ inputs.cache_variant }}
      source_sha: ${{ fromJSON(needs.source.outputs.shas)[4] }}
      expected_parent: ${{ fromJSON(needs.source.outputs.shas)[3] }}
      rolling_step: "04"
      rolling_previous: "03"
      cli_version: ${{ inputs.cli_version }}

  step05:
    needs: [source, step04]
    strategy:
      fail-fast: false
      matrix:
        provider: [runs-on-cache, boringcache]
    uses: ./.github/workflows/deno-runs-on-phase.yml
    with:
      provider: ${{ matrix.provider }}
      phase: source_change
      cache_variant: ${{ inputs.cache_variant }}
      source_sha: ${{ fromJSON(needs.source.outputs.shas)[5] }}
      expected_parent: ${{ fromJSON(needs.source.outputs.shas)[4] }}
      rolling_step: "05"
      rolling_previous: "04"
      cli_version: ${{ inputs.cli_version }}

  step06:
    needs: [source, step05]
    strategy:
      fail-fast: false
      matrix:
        provider: [runs-on-cache, boringcache]
    uses: ./.github/workflows/deno-runs-on-phase.yml
    with:
      provider: ${{ matrix.provider }}
      phase: source_change
      cache_variant: ${{ inputs.cache_variant }}
      source_sha: ${{ fromJSON(needs.source.outputs.shas)[6] }}
      expected_parent: ${{ fromJSON(needs.source.outputs.shas)[5] }}
      rolling_step: "06"
      rolling_previous: "05"
      cli_version: ${{ inputs.cli_version }}

  step07:
    needs: [source, step06]
    strategy:
      fail-fast: false
      matrix:
        provider: [runs-on-cache, boringcache]
    uses: ./.github/workflows/deno-runs-on-phase.yml
    with:
      provider: ${{ matrix.provider }}
      phase: source_change
      cache_variant: ${{ inputs.cache_variant }}
      source_sha: ${{ fromJSON(needs.source.outputs.shas)[7] }}
      expected_parent: ${{ fromJSON(needs.source.outputs.shas)[6] }}
      rolling_step: "07"
      rolling_previous: "06"
      cli_version: ${{ inputs.cli_version }}

  step08:
    needs: [source, step07]
    strategy:
      fail-fast: false
      matrix:
        provider: [runs-on-cache, boringcache]
    uses: ./.github/workflows/deno-runs-on-phase.yml
    with:
      provider: ${{ matrix.provider }}
      phase: source_change
      cache_variant: ${{ inputs.cache_variant }}
      source_sha: ${{ fromJSON(needs.source.outputs.shas)[8] }}
      expected_parent: ${{ fromJSON(needs.source.outputs.shas)[7] }}
      rolling_step: "08"
      rolling_previous: "07"
      cli_version: ${{ inputs.cli_version }}

  step09:
    needs: [source, step08]
    strategy:
      fail-fast: false
      matrix:
        provider: [runs-on-cache, boringcache]
    uses: ./.github/workflows/deno-runs-on-phase.yml
    with:
      provider: ${{ matrix.provider }}
      phase: source_change
      cache_variant: ${{ inputs.cache_variant }}
      source_sha: ${{ fromJSON(needs.source.outputs.shas)[9] }}
      expected_parent: ${{ fromJSON(needs.source.outputs.shas)[8] }}
      rolling_step: "09"
      rolling_previous: "08"
      cli_version: ${{ inputs.cli_version }}

  step10:
    needs: [source, step09]
    strategy:
      fail-fast: false
      matrix:
        provider: [runs-on-cache, boringcache]
    uses: ./.github/workflows/deno-runs-on-phase.yml
    with:
      provider: ${{ matrix.provider }}
      phase: warm
      cache_variant: ${{ inputs.cache_variant }}
      source_sha: ${{ fromJSON(needs.source.outputs.shas)[9] }}
      rolling_step: "10"
      rolling_previous: "09"
      cli_version: ${{ inputs.cli_version }}

  report:
    name: Compare all eleven builds
    needs: step10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          pattern: phase-deno-runson-*-step*
          path: phase-evidence
      - name: Summarize the rolling sequence
        run: |
          python3 ./scripts/benchmark-report.py summarize \
            --title "Deno 10-commit RunsOn ${{ inputs.cache_variant }} rolling comparison" \
            --baseline-strategy runs-on-cache \
            --no-deltas \
            --input-dir phase-evidence \
            --output-dir benchmark-results
      - uses: actions/upload-artifact@v6
        with:
          name: deno-runson-rolling11-comparison
          path: benchmark-results/
          if-no-files-found: error

  bucket-after:
    name: Inspect RunsOn cache bucket after builds
    needs: report
    if: always()
    runs-on: ${{ format('runs-on={0}/cpu=16/ram=64/family=m7i.*+m7a/image=ubuntu24-full-x64/volume=300gb:gp3/env=benchmark/region=us-east-1/spot=false/extras=s3-cache', github.run_id) }}
    steps:
      - uses: runs-on/action@efac073ea2507ec18797de3a81704201ade11d9d # v2.3.1
      - uses: actions/checkout@v6
      - name: Summarize cache objects
        run: |
          mkdir -p benchmark-results
          python3 ./scripts/report-runs-on-s3.py after benchmark-results/bucket-after.json
      - uses: actions/upload-artifact@v6
        with:
          name: deno-runson-bucket-after
          path: benchmark-results/bucket-after.json
          if-no-files-found: error
