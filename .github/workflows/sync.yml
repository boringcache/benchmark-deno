name: "Sync Upstream"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: benchmark-deno-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync With Upstream
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_PUBLIC_GITHUB_TOKEN }}

      - name: Require the previous fresh product cohort to be green
        id: previous
        env:
          GH_TOKEN: ${{ secrets.BOT_PUBLIC_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source_commit="$(git log -1 --format=%H -- benchmark-source.env)"
          run_json="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow deno-rust-cache-proof.yml \
            --event push \
            --commit "$source_commit" \
            --limit 1 \
            --json status,conclusion,url)"

          if [[ "$(jq length <<<"$run_json")" -eq 0 ]]; then
            echo "No fresh product cohort found for source commit ${source_commit}" >&2
            exit 1
          fi

          status="$(jq -r '.[0].status' <<<"$run_json")"
          conclusion="$(jq -r '.[0].conclusion // empty' <<<"$run_json")"
          url="$(jq -r '.[0].url' <<<"$run_json")"
          if [[ "$status" != "completed" ]]; then
            echo "Waiting for ${url}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$conclusion" != "success" ]]; then
            echo "Previous fresh product cohort did not succeed: ${url}" >&2
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Advance the adjacent source pair
        if: steps.previous.outputs.ready == 'true'
        id: source
        env:
          GH_TOKEN: ${{ secrets.BOT_PUBLIC_GITHUB_TOKEN }}
        run: ./scripts/advance-source-pair.sh benchmark-source.env DENO

      - name: Commit the upstream update
        if: steps.previous.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- benchmark-source.env; then
            echo "No upstream changes"
            exit 0
          fi

          git config user.name "boringcache-bot"
          git config user.email "boringcache-bot@users.noreply.github.com"
          git add benchmark-source.env
          git commit -m "Update upstream to ${{ steps.source.outputs.source_repository }}@${{ steps.source.outputs.source_short_sha }}"
          git push origin HEAD:main
