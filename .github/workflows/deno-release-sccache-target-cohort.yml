name: "Deno release sccache plus target cohort"
run-name: "Deno sccache plus target cohort | CLI ${{ inputs.cli_version }}"

on:
  workflow_dispatch:
    inputs:
      cli_version:
        required: true
        default: "v1.15.0"
        type: string

permissions:
  actions: write
  contents: read

env:
  BENCHMARK_ID: deno-release-rust-cache
  BENCHMARK_WORKSPACE: ${{ github.repository }}
  DENO_BENCHMARK_PROFILE: release
  RELEASE_ACTION_SHA: 8294be671cd5a2b73638df1b8e1e240df888297e

jobs:
  seed:
    name: Build one sccache-consistent seed
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      actions_cache_key: ${{ steps.identity.outputs.actions_cache_key }}
      boringcache_archive_tags: ${{ steps.identity.outputs.boringcache_archive_tags }}
      boringcache_sccache_tag: ${{ steps.identity.outputs.boringcache_sccache_tag }}
    steps:
      - name: Validate BoringCache secrets
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
        run: |
          [[ -n "$BORINGCACHE_RESTORE_TOKEN" ]] || { echo "Missing BoringCache restore token" >&2; exit 1; }
          [[ -n "$BORINGCACHE_SAVE_TOKEN" ]] || { echo "Missing BoringCache save token" >&2; exit 1; }

      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Read pinned source
        id: source
        run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Deno base source
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.source.outputs.DENO_SOURCE_REPOSITORY }}
          ref: ${{ steps.source.outputs.DENO_BASE_SHA }}
          path: upstream
          fetch-depth: 2
          submodules: false

      - name: Prepare base source
        run: ./scripts/prepare-source.sh base

      - name: Install Deno snapshot minifier runtime
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ steps.source.outputs.DENO_RUST_VERSION }}

      - name: Free runner disk space
        run: ./scripts/free-runner-disk.sh

      - name: Configure Deno Linux build environment
        run: ./scripts/setup-deno-linux.sh

      - name: Scope the shared seed
        run: ./scripts/scope-boringcache-run.sh "r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"

      - name: Prepare cache destinations
        run: mkdir -p upstream/target "$HOME/.cache/sccache" "$HOME/.local/bin"

      - name: Configure BoringCache sccache and target publication
        id: cache
        uses: boringcache/one@8294be671cd5a2b73638df1b8e1e240df888297e # v1.15.0
        with:
          setup: none
          cli-version: ${{ inputs.cli_version }}
          mode: sccache
          trust-policy: publish
          working-directory: .
          cache-profiles: full-target
          sccache-version: 0.16.0
          verify: wait
          diagnostics: verbose
          metadata-hints: |
            benchmark=deno-release-rust-cache
            phase=shared-sccache-target-seed
          fail-on-cache-error: true
          verbose: true
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}

      - name: Add local disk to the adapter-owned sccache backend
        run: ./scripts/configure-sccache-cohort.sh disk-webdav

      - name: Require one compiler identity for both representations
        run: |
          [[ "$RUSTC_WRAPPER" == "sccache" ]] || { echo "Expected RUSTC_WRAPPER=sccache" >&2; exit 1; }
          [[ "$CC" == "/usr/bin/clang-22" ]] || { echo "Unexpected CC=$CC" >&2; exit 1; }
          [[ "$CXX" == "sccache c++" ]] || { echo "Unexpected CXX=$CXX" >&2; exit 1; }
          [[ "$SCCACHE_MULTILEVEL_CHAIN" == "disk,webdav" ]] || { echo "Unexpected sccache chain" >&2; exit 1; }
          [[ "$SCCACHE_MULTILEVEL_WRITE_ERROR_POLICY" == "all" ]] || { echo "The seed must require both cache writes" >&2; exit 1; }

      - name: Establish the base source mtime identity
        run: |
          node ./scripts/run-deno-mtime-cache.js ./upstream |
            tee /tmp/deno-shared-seed-mtime.log
          test -s upstream/target/.mtime-cache-db.json

      - name: Build the shared base seed
        env:
          DENO_CARGO_EVIDENCE_FILE: /tmp/deno-shared-seed-cargo.jsonl
        run: |
          sccache --zero-stats >/dev/null 2>&1 || true
          ./scripts/run-deno-build.sh
          sccache --show-stats | tee /tmp/deno-shared-seed-sccache-stats.txt

      - name: Require complete seed state
        run: |
          test -x upstream/target/release/deno
          test -s upstream/target/.mtime-cache-db.json
          test -d "$HOME/.cache/sccache"
          cp "$(command -v sccache)" "$HOME/.local/bin/sccache"
          chmod +x "$HOME/.local/bin/sccache"

      - name: Flush local sccache before archiving
        run: sccache --stop-server >/dev/null

      - name: Save the Actions target and local sccache archive
        uses: actions/cache/save@v5
        with:
          key: gha-deno-release-sccache-target-r${{ github.run_id }}-a${{ github.run_attempt }}-base
          path: |
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/sccache
            ~/.local/bin/sccache
            upstream/target
            !upstream/target/*/gn_out
            !upstream/target/*/gn_root
            !upstream/target/*/*.zip
            !upstream/target/*/*.tar.gz

      - name: Restart sccache for managed shutdown
        run: sccache --start-server >/dev/null

      - name: Capture shared seed identities
        id: identity
        run: |
          archive_tags="${{ steps.cache.outputs.resolved-tags }}"
          sccache_tag="${{ steps.cache.outputs.sccache-tag }}"
          [[ -n "$archive_tags" ]] || { echo "BoringCache did not resolve archive tags" >&2; exit 1; }
          [[ -n "$sccache_tag" ]] || { echo "BoringCache did not resolve an sccache tag" >&2; exit 1; }
          {
            echo "actions_cache_key=gha-deno-release-sccache-target-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}-base"
            echo "boringcache_archive_tags=${archive_tags}"
            echo "boringcache_sccache_tag=${sccache_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload shared seed native evidence
        uses: actions/upload-artifact@v6
        with:
          name: deno-release-sccache-target-shared-seed
          path: |
            /tmp/deno-shared-seed-cargo.jsonl
            /tmp/deno-shared-seed-mtime.log
            /tmp/deno-shared-seed-sccache-stats.txt
          if-no-files-found: error

  actions-rolling:
    name: Restore target plus archived local sccache
    needs: seed
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Read pinned source
        id: source
        run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Deno rolling source
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.source.outputs.DENO_SOURCE_REPOSITORY }}
          ref: ${{ steps.source.outputs.DENO_HEAD_SHA }}
          path: upstream
          fetch-depth: 2
          submodules: false

      - name: Prepare rolling source
        run: ./scripts/prepare-source.sh head

      - name: Install Deno snapshot minifier runtime
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ steps.source.outputs.DENO_RUST_VERSION }}

      - name: Free runner disk space
        run: ./scripts/free-runner-disk.sh

      - name: Configure Deno Linux build environment
        run: ./scripts/setup-deno-linux.sh

      - name: Start cache restore timing
        id: cache_start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Restore the shared Actions archive
        uses: actions/cache/restore@v5
        with:
          key: ${{ needs.seed.outputs.actions_cache_key }}
          path: |
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/sccache
            ~/.local/bin/sccache
            upstream/target
          fail-on-cache-miss: true

      - name: Put the restored sccache binary on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure the local sccache cohort
        run: ./scripts/configure-sccache-cohort.sh disk

      - name: Require restored state and compiler identity
        run: |
          test -x upstream/target/release/deno
          test -s upstream/target/.mtime-cache-db.json
          [[ "$(sccache --version)" == "sccache 0.16.0" ]] || { sccache --version >&2; exit 1; }
          [[ "$RUSTC_WRAPPER" == "sccache" ]] || { echo "Unexpected Rust wrapper" >&2; exit 1; }
          [[ "$CC" == "/usr/bin/clang-22" ]] || { echo "Unexpected CC=$CC" >&2; exit 1; }
          [[ "$CXX" == "sccache c++" ]] || { echo "Unexpected CXX=$CXX" >&2; exit 1; }
          [[ "$SCCACHE_MULTILEVEL_CHAIN" == "disk" ]] || { echo "Unexpected sccache chain" >&2; exit 1; }

      - name: Apply Deno mtime cache
        run: |
          cp upstream/target/.mtime-cache-db.json /tmp/deno-actions-cohort-mtime-before.json
          node ./scripts/run-deno-mtime-cache.js ./upstream | tee /tmp/deno-actions-cohort-mtime.log

      - name: Capture cache restore timing
        id: cache_timing
        run: echo "seconds=$(( $(date +%s) - ${{ steps.cache_start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

      - name: Measure Actions archive storage
        id: cache_size
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bytes="$(./scripts/sum-gha-cache-by-key.sh "${{ needs.seed.outputs.actions_cache_key }}")"
          if [[ ! "$bytes" =~ ^[0-9]+$ ]] || (( bytes == 0 )); then
            echo "Actions cache size was unavailable" >&2
            exit 1
          fi
          echo "bytes=${bytes}" >> "$GITHUB_OUTPUT"

      - name: Build rolling commit with local sccache
        id: build
        env:
          DENO_CARGO_EVIDENCE_FILE: /tmp/deno-actions-cohort-cargo.jsonl
        run: |
          sccache --zero-stats >/dev/null 2>&1 || true
          started_at="$(date +%s)"
          ./scripts/run-deno-build.sh
          finished_at="$(date +%s)"
          echo "seconds=$((finished_at - started_at))" >> "$GITHUB_OUTPUT"
          sccache --show-stats | tee /tmp/deno-actions-cohort-sccache-stats.txt

      - name: Verify Actions restored freshness
        run: |
          ./scripts/verify_restored_freshness.py \
            --source-root upstream \
            --mtime-before /tmp/deno-actions-cohort-mtime-before.json \
            --mtime-after upstream/target/.mtime-cache-db.json \
            --mtime-log /tmp/deno-actions-cohort-mtime.log \
            --cargo-messages /tmp/deno-actions-cohort-cargo.jsonl \
            --output benchmark-results/deno-actions-cohort-freshness.json

      - name: Write Actions rolling result
        run: |
          end_to_end="$(( ${{ steps.cache_timing.outputs.seconds }} + ${{ steps.build.outputs.seconds }} ))"
          ./scripts/write_phase_result.py \
            --benchmark "$BENCHMARK_ID" \
            --strategy actions-cache \
            --build-profile "$DENO_BENCHMARK_PROFILE" \
            --phase rolling \
            --source-sha "${{ steps.source.outputs.DENO_HEAD_SHA }}" \
            --restore-seconds "${{ steps.cache_timing.outputs.seconds }}" \
            --build-seconds "${{ steps.build.outputs.seconds }}" \
            --end-to-end-seconds "$end_to_end" \
            --cache-storage-bytes "${{ steps.cache_size.outputs.bytes }}" \
            --cache-key "${{ needs.seed.outputs.actions_cache_key }}" \
            --cache-mode target-archive-plus-local-sccache \
            --cache-components actions-cargo-paths,full-target-directory,local-sccache \
            --cache-import-status hit \
            --sccache-stats-file /tmp/deno-actions-cohort-sccache-stats.txt \
            --require-sccache-evidence \
            --freshness-evidence-file benchmark-results/deno-actions-cohort-freshness.json \
            --require-freshness-evidence \
            --cli-version "${{ inputs.cli_version }}" \
            --action-sha "$RELEASE_ACTION_SHA"

      - name: Upload Actions rolling evidence
        uses: actions/upload-artifact@v6
        with:
          name: phase-${{ env.BENCHMARK_ID }}-actions-cache-rolling
          path: |
            benchmark-results/actions-cache-rolling.json
            benchmark-results/deno-actions-cohort-freshness.json
            /tmp/deno-actions-cohort-sccache-stats.txt
          if-no-files-found: error

  boringcache-rolling:
    name: Restore target plus remote sccache
    needs: seed
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Validate BoringCache restore secret
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
        run: |
          [[ -n "$BORINGCACHE_RESTORE_TOKEN" ]] || { echo "Missing BoringCache restore token" >&2; exit 1; }

      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Read pinned source
        id: source
        run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Deno rolling source
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.source.outputs.DENO_SOURCE_REPOSITORY }}
          ref: ${{ steps.source.outputs.DENO_HEAD_SHA }}
          path: upstream
          fetch-depth: 2
          submodules: false

      - name: Prepare rolling source
        run: ./scripts/prepare-source.sh head

      - name: Install Deno snapshot minifier runtime
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ steps.source.outputs.DENO_RUST_VERSION }}

      - name: Free runner disk space
        run: ./scripts/free-runner-disk.sh

      - name: Configure Deno Linux build environment
        run: ./scripts/setup-deno-linux.sh

      - name: Reuse the shared seed tags
        run: ./scripts/scope-boringcache-run.sh "r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"

      - name: Start cache restore timing
        id: cache_start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Restore the shared BoringCache target and sccache
        id: cache
        uses: boringcache/one@8294be671cd5a2b73638df1b8e1e240df888297e # v1.15.0
        with:
          setup: none
          cli-version: ${{ inputs.cli_version }}
          mode: sccache
          trust-policy: restore
          working-directory: .
          cache-profiles: full-target
          sccache-version: 0.16.0
          verify: check
          diagnostics: verbose
          metadata-hints: |
            benchmark=deno-release-rust-cache
            phase=sccache-target-cohort-rolling
          fail-on-cache-error: true
          fail-on-cache-miss: true
          verbose: true
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}

      - name: Require the adapter-owned remote sccache backend
        run: ./scripts/configure-sccache-cohort.sh webdav

      - name: Require restored state and compiler identity
        run: |
          [[ "${{ steps.cache.outputs.sccache-hit }}" == "true" ]] || { echo "The shared sccache tag missed" >&2; exit 1; }
          test -x upstream/target/release/deno
          test -s upstream/target/.mtime-cache-db.json
          [[ "$RUSTC_WRAPPER" == "sccache" ]] || { echo "Unexpected Rust wrapper" >&2; exit 1; }
          [[ "$CC" == "/usr/bin/clang-22" ]] || { echo "Unexpected CC=$CC" >&2; exit 1; }
          [[ "$CXX" == "sccache c++" ]] || { echo "Unexpected CXX=$CXX" >&2; exit 1; }
          [[ "$SCCACHE_MULTILEVEL_CHAIN" == "webdav" ]] || { echo "Unexpected sccache chain" >&2; exit 1; }

      - name: Apply Deno mtime cache
        run: |
          cp upstream/target/.mtime-cache-db.json /tmp/deno-boringcache-cohort-mtime-before.json
          node ./scripts/run-deno-mtime-cache.js ./upstream | tee /tmp/deno-boringcache-cohort-mtime.log

      - name: Capture cache restore timing
        id: cache_timing
        run: echo "seconds=$(( $(date +%s) - ${{ steps.cache_start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

      - name: Measure BoringCache cohort storage
        id: cache_size
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_EXACT_TAGS: ${{ needs.seed.outputs.boringcache_sccache_tag }}
        run: |
          bytes="$(./scripts/sum-boringcache-check-sizes.sh \
            "$BENCHMARK_WORKSPACE" \
            "${{ steps.cache.outputs.resolved-tags }}")"
          if [[ ! "$bytes" =~ ^[0-9]+$ ]] || (( bytes == 0 )); then
            echo "BoringCache size was unavailable" >&2
            exit 1
          fi
          echo "bytes=${bytes}" >> "$GITHUB_OUTPUT"

      - name: Build rolling commit with remote sccache
        id: build
        env:
          DENO_CARGO_EVIDENCE_FILE: /tmp/deno-boringcache-cohort-cargo.jsonl
        run: |
          sccache --zero-stats >/dev/null 2>&1 || true
          started_at="$(date +%s)"
          ./scripts/run-deno-build.sh
          finished_at="$(date +%s)"
          echo "seconds=$((finished_at - started_at))" >> "$GITHUB_OUTPUT"
          sccache --show-stats | tee /tmp/deno-boringcache-cohort-sccache-stats.txt

      - name: Verify BoringCache restored freshness
        run: |
          ./scripts/verify_restored_freshness.py \
            --source-root upstream \
            --mtime-before /tmp/deno-boringcache-cohort-mtime-before.json \
            --mtime-after upstream/target/.mtime-cache-db.json \
            --mtime-log /tmp/deno-boringcache-cohort-mtime.log \
            --cargo-messages /tmp/deno-boringcache-cohort-cargo.jsonl \
            --output benchmark-results/deno-boringcache-cohort-freshness.json

      - name: Write BoringCache rolling result
        run: |
          end_to_end="$(( ${{ steps.cache_timing.outputs.seconds }} + ${{ steps.build.outputs.seconds }} ))"
          ./scripts/write_phase_result.py \
            --benchmark "$BENCHMARK_ID" \
            --strategy boringcache-full-target \
            --build-profile "$DENO_BENCHMARK_PROFILE" \
            --phase rolling \
            --source-sha "${{ steps.source.outputs.DENO_HEAD_SHA }}" \
            --restore-seconds "${{ steps.cache_timing.outputs.seconds }}" \
            --build-seconds "${{ steps.build.outputs.seconds }}" \
            --end-to-end-seconds "$end_to_end" \
            --cache-storage-bytes "${{ steps.cache_size.outputs.bytes }}" \
            --cache-key "${{ steps.cache.outputs.resolved-tags }}" \
            --cache-mode full-target-archive-plus-remote-sccache \
            --cache-components actions-cargo-paths,full-target-directory,remote-sccache \
            --cache-import-status hit \
            --sccache-stats-file /tmp/deno-boringcache-cohort-sccache-stats.txt \
            --require-sccache-evidence \
            --freshness-evidence-file benchmark-results/deno-boringcache-cohort-freshness.json \
            --require-freshness-evidence \
            --cli-version "${{ inputs.cli_version }}" \
            --action-sha "$RELEASE_ACTION_SHA"

      - name: Upload BoringCache rolling evidence
        uses: actions/upload-artifact@v6
        with:
          name: phase-${{ env.BENCHMARK_ID }}-boringcache-full-target-rolling
          path: |
            benchmark-results/boringcache-full-target-rolling.json
            benchmark-results/deno-boringcache-cohort-freshness.json
            /tmp/deno-boringcache-cohort-sccache-stats.txt
          if-no-files-found: error

  compare:
    name: Compare the same sccache plus target cohort
    needs: [actions-rolling, boringcache-rolling]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Download rolling results
        uses: actions/download-artifact@v8
        with:
          pattern: phase-${{ env.BENCHMARK_ID }}-*-rolling
          path: benchmark-results
          merge-multiple: true

      - name: Render cohort comparison
        run: |
          ./scripts/compare_rolling_controls.py \
            --baseline benchmark-results/actions-cache-rolling.json \
            --candidate benchmark-results/boringcache-full-target-rolling.json \
            --output-dir benchmark-results/cohort \
            --title "Deno release sccache plus target cohort"

      - name: Publish job summary
        run: cat benchmark-results/cohort/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cohort comparison
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ env.BENCHMARK_ID }}-sccache-target-cohort
          path: benchmark-results/cohort
          if-no-files-found: error
