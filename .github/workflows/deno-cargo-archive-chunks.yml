name: "Deno Cargo archive chunks canary"
run-name: Deno Cargo chunks vs monolith | ${{ inputs.cli_version }}

on:
  workflow_call:
    inputs:
      cli_version:
        description: Immutable BoringCache CLI canary tag.
        required: true
        type: string
      source_run_id:
        description: Existing release proof run containing the sccache seed.
        required: false
        type: string
        default: "30333408848"
      source_run_attempt:
        description: Attempt number for the source proof run.
        required: false
        type: string
        default: "1"
  workflow_dispatch:
    inputs:
      cli_version:
        description: Immutable BoringCache CLI canary tag.
        required: true
        type: string
      source_run_id:
        description: Existing release proof run containing the sccache seed.
        required: false
        type: string
        default: "30333408848"
      source_run_attempt:
        description: Attempt number for the source proof run.
        required: false
        type: string
        default: "1"

permissions:
  actions: read
  contents: read

env:
  BENCHMARK_ID: deno-release-rust-cache
  BENCHMARK_WORKSPACE: boringcache/benchmark-deno
  DENO_BENCHMARK_PROFILE: release
  SOURCE_RUN_ID: ${{ inputs.source_run_id }}
  SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}

jobs:
  publish-base:
    name: Publish one base target through both transports
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Validate BoringCache secrets
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
        run: |
          [[ -n "$BORINGCACHE_RESTORE_TOKEN" ]] || { echo "Missing BoringCache restore token" >&2; exit 1; }
          [[ -n "$BORINGCACHE_SAVE_TOKEN" ]] || { echo "Missing BoringCache save token" >&2; exit 1; }

      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Read pinned source
        id: source
        run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Deno base source
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.source.outputs.DENO_SOURCE_REPOSITORY }}
          ref: ${{ steps.source.outputs.DENO_BASE_SHA }}
          path: upstream
          fetch-depth: 2
          submodules: false

      - name: Prepare base source
        run: ./scripts/prepare-source.sh base

      - name: Install Deno snapshot minifier runtime
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: Install pinned Rust toolchain and exact CLI with BoringCache
        uses: boringcache/one@8294be671cd5a2b73638df1b8e1e240df888297e # v1.15.0
        with:
          cli-version: ${{ inputs.cli_version }}
          trust-policy: restore
          setup: mise
          tools: rust@${{ steps.source.outputs.DENO_RUST_VERSION }}
          mode: archive
          cache-profiles: rust-toolchain
          working-directory: .
          verify: none
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}

      - name: Free runner disk space
        run: ./scripts/free-runner-disk.sh

      - name: Configure Deno Linux build environment
        run: ./scripts/setup-deno-linux.sh

      - name: Install exact sccache
        run: ./scripts/install-sccache.sh 0.16.0

      - name: Require a clean product starting point
        run: |
          test ! -e upstream/target
          cp .boringcache.toml /tmp/deno-boringcache-product-plan.toml

      - name: Scope the monolith Cargo product plan
        run: |
          ./scripts/scope-boringcache-run.sh \
            "r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}" \
            "r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}" \
            "-monolith" \
            "-monolith"

      - name: Build and publish the monolith through boringcache cargo
        id: publish-monolith
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
          BORINGCACHE_ARCHIVE_GRAPH_WRITES: "0"
          DENO_USE_BORINGCACHE_CARGO: "1"
          DENO_BORINGCACHE_CARGO_ACCESS: publish
          DENO_BORINGCACHE_METADATA_PHASE: base-monolith
          DENO_BORINGCACHE_NATIVE_EVIDENCE_DIR: /tmp/deno-base-native-monolith
          DENO_CARGO_EVIDENCE_FILE: /tmp/deno-base-cargo-monolith.jsonl
        run: |
          set -euo pipefail
          mkdir -p /tmp/deno-base-native-monolith
          started_at="$(date +%s)"
          ./scripts/run-deno-build.sh 2>&1 | tee /tmp/deno-base-cli-monolith.log
          elapsed="$(( $(date +%s) - started_at ))"
          echo "elapsed_seconds=${elapsed}" >> "$GITHUB_OUTPUT"

      - name: Inspect the monolith publication
        id: target-monolith
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
        run: |
          target_tag_raw="deno-cargo-target-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}-monolith"
          boringcache check "$BENCHMARK_WORKSPACE" "$target_tag_raw" --no-git --json \
            | tee /tmp/deno-base-check-monolith.json
          target_tag="$(jq -r '.results[] | select(.status == "hit") | .tag' /tmp/deno-base-check-monolith.json)"
          [[ -n "$target_tag" ]] || { echo "Published target did not resolve" >&2; exit 1; }
          target_size="$(du -sb upstream/target | awk '{ print $1 }')"
          boringcache inspect "$BENCHMARK_WORKSPACE" "$target_tag" --json \
            | tee /tmp/deno-base-inspect-monolith.json
          jq -e '.entry.storage_mode == "archive" and .entry.cas_layout == null and .entry.server_signed' \
            /tmp/deno-base-inspect-monolith.json
          echo "tag=${target_tag}" >> "$GITHUB_OUTPUT"
          echo "target_size_bytes=${target_size}" >> "$GITHUB_OUTPUT"

      - name: Write monolith base evidence
        run: |
          evidence_dir="benchmark-results/evidence-base-monolith"
          mkdir -p "$evidence_dir"
          jq -n \
            --arg schema_version deno_boringcache_cargo_base.v1 \
            --arg transport monolith \
            --arg cli_version "${{ inputs.cli_version }}" \
            --arg target_tag "${{ steps.target-monolith.outputs.tag }}" \
            --argjson elapsed_seconds "${{ steps.publish-monolith.outputs.elapsed_seconds }}" \
            --argjson target_size_bytes "${{ steps.target-monolith.outputs.target_size_bytes }}" \
            --slurpfile inspection /tmp/deno-base-inspect-monolith.json \
            '{schema_version: $schema_version, transport: $transport, cli_version: $cli_version, target_tag: $target_tag, elapsed_seconds: $elapsed_seconds, target_size_bytes: $target_size_bytes, archive: $inspection[0].entry}' \
            > benchmark-results/base-monolith.json
          cp /tmp/deno-base-cli-monolith.log "$evidence_dir/cli.log"
          cp /tmp/deno-base-cargo-monolith.jsonl "$evidence_dir/cargo.jsonl"
          cp /tmp/deno-base-native-monolith/*.json "$evidence_dir/"

      - name: Scope the chunk Cargo product plan
        run: |
          cp /tmp/deno-boringcache-product-plan.toml .boringcache.toml
          ./scripts/scope-boringcache-run.sh \
            "r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}" \
            "r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}" \
            "-chunks" \
            "-chunks"

      - name: Reuse and publish the same target as chunks through boringcache cargo
        id: publish-chunks
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
          BORINGCACHE_ARCHIVE_GRAPH_WRITES: "1"
          DENO_USE_BORINGCACHE_CARGO: "1"
          DENO_BORINGCACHE_CARGO_ACCESS: publish
          DENO_BORINGCACHE_METADATA_PHASE: base-chunks
          DENO_BORINGCACHE_NATIVE_EVIDENCE_DIR: /tmp/deno-base-native-chunks
          DENO_CARGO_EVIDENCE_FILE: /tmp/deno-base-cargo-chunks.jsonl
        run: |
          set -euo pipefail
          mkdir -p /tmp/deno-base-native-chunks
          started_at="$(date +%s)"
          ./scripts/run-deno-build.sh 2>&1 | tee /tmp/deno-base-cli-chunks.log
          elapsed="$(( $(date +%s) - started_at ))"
          echo "elapsed_seconds=${elapsed}" >> "$GITHUB_OUTPUT"

      - name: Inspect the chunk publication
        id: target-chunks
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
        run: |
          target_tag_raw="deno-cargo-target-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}-chunks"
          boringcache check "$BENCHMARK_WORKSPACE" "$target_tag_raw" --no-git --json \
            | tee /tmp/deno-base-check-chunks.json
          target_tag="$(jq -r '.results[] | select(.status == "hit") | .tag' /tmp/deno-base-check-chunks.json)"
          [[ -n "$target_tag" ]] || { echo "Published target did not resolve" >&2; exit 1; }
          target_size="$(du -sb upstream/target | awk '{ print $1 }')"
          boringcache inspect "$BENCHMARK_WORKSPACE" "$target_tag" --json \
            | tee /tmp/deno-base-inspect-chunks.json
          jq -e '.entry.storage_mode == "cas" and .entry.cas_layout == "archive-chunks-v1" and .entry.server_signed and .entry.storage_verified and .entry.blob_count > 1' \
            /tmp/deno-base-inspect-chunks.json
          echo "tag=${target_tag}" >> "$GITHUB_OUTPUT"
          echo "target_size_bytes=${target_size}" >> "$GITHUB_OUTPUT"

      - name: Prove both transports captured one local target cohort
        run: |
          test -x upstream/target/release/deno
          test -s upstream/target/.boringcache/cargo-freshness-v2.json
          [[ "${{ steps.target-monolith.outputs.target_size_bytes }}" == \
            "${{ steps.target-chunks.outputs.target_size_bytes }}" ]]

      - name: Write chunk base evidence
        run: |
          evidence_dir="benchmark-results/evidence-base-chunks"
          mkdir -p "$evidence_dir"
          jq -n \
            --arg schema_version deno_boringcache_cargo_base.v1 \
            --arg transport chunks \
            --arg cli_version "${{ inputs.cli_version }}" \
            --arg target_tag "${{ steps.target-chunks.outputs.tag }}" \
            --argjson elapsed_seconds "${{ steps.publish-chunks.outputs.elapsed_seconds }}" \
            --argjson target_size_bytes "${{ steps.target-chunks.outputs.target_size_bytes }}" \
            --slurpfile inspection /tmp/deno-base-inspect-chunks.json \
            '{schema_version: $schema_version, transport: $transport, cli_version: $cli_version, target_tag: $target_tag, elapsed_seconds: $elapsed_seconds, target_size_bytes: $target_size_bytes, archive: $inspection[0].entry}' \
            > benchmark-results/base-chunks.json
          cp /tmp/deno-base-cli-chunks.log "$evidence_dir/cli.log"
          cp /tmp/deno-base-cargo-chunks.jsonl "$evidence_dir/cargo.jsonl"
          cp /tmp/deno-base-native-chunks/*.json "$evidence_dir/"

      - name: Upload base evidence
        uses: actions/upload-artifact@v6
        with:
          name: deno-cargo-base-transports
          path: benchmark-results
          if-no-files-found: error

  consume-rolling:
    name: Consume rolling target (${{ matrix.transport }})
    needs: publish-base
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - transport: chunks
            suffix: -chunks
            graph_writes: "1"
          - transport: monolith
            suffix: -monolith
            graph_writes: "0"
    steps:
      - name: Validate BoringCache restore secret
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
        run: |
          [[ -n "$BORINGCACHE_RESTORE_TOKEN" ]] || { echo "Missing BoringCache restore token" >&2; exit 1; }

      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Read pinned source
        id: source
        run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Deno rolling source
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.source.outputs.DENO_SOURCE_REPOSITORY }}
          ref: ${{ steps.source.outputs.DENO_HEAD_SHA }}
          path: upstream
          fetch-depth: 2
          submodules: false

      - name: Prepare rolling source
        run: ./scripts/prepare-source.sh head

      - name: Install Deno snapshot minifier runtime
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: Install pinned Rust toolchain and exact CLI with BoringCache
        uses: boringcache/one@8294be671cd5a2b73638df1b8e1e240df888297e # v1.15.0
        with:
          cli-version: ${{ inputs.cli_version }}
          trust-policy: restore
          setup: mise
          tools: rust@${{ steps.source.outputs.DENO_RUST_VERSION }}
          mode: archive
          cache-profiles: rust-toolchain
          working-directory: .
          verify: none
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}

      - name: Free runner disk space
        run: ./scripts/free-runner-disk.sh

      - name: Configure Deno Linux build environment
        run: ./scripts/setup-deno-linux.sh

      - name: Scope archives and reuse the source sccache tag
        run: |
          ./scripts/scope-boringcache-run.sh \
            "r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}" \
            "r${SOURCE_RUN_ID}-a${SOURCE_RUN_ATTEMPT}" \
            "${{ matrix.suffix }}" \
            "${{ matrix.suffix }}"

      - name: Install exact sccache
        run: ./scripts/install-sccache.sh 0.16.0

      - name: Require an empty target
        run: test ! -e upstream/target

      - name: Require the existing sccache seed
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
        run: |
          sccache_tag="deno-rust-cache-r${SOURCE_RUN_ID}-a${SOURCE_RUN_ATTEMPT}${{ matrix.suffix }}"
          boringcache check "$BENCHMARK_WORKSPACE" "$sccache_tag" --no-git --json \
            | tee /tmp/deno-rolling-sccache-check.json
          jq -e '.results[] | select(.status == "hit" and .kv_entry_count > 0)' \
            /tmp/deno-rolling-sccache-check.json

      - name: Inspect source target
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
        run: |
          target_tag_raw="deno-cargo-target-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}${{ matrix.suffix }}"
          boringcache check "$BENCHMARK_WORKSPACE" "$target_tag_raw" --no-git --json \
            | tee "/tmp/deno-rolling-check-${{ matrix.transport }}.json"
          target_tag="$(jq -r '.results[] | select(.status == "hit") | .tag' "/tmp/deno-rolling-check-${{ matrix.transport }}.json")"
          [[ -n "$target_tag" ]] || { echo "Source target did not resolve" >&2; exit 1; }
          boringcache inspect "$BENCHMARK_WORKSPACE" "$target_tag" --json \
            | tee "/tmp/deno-rolling-inspect-${{ matrix.transport }}.json"

      - name: Restore and build through boringcache cargo
        id: consume
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_ARCHIVE_GRAPH_WRITES: ${{ matrix.graph_writes }}
          DENO_USE_BORINGCACHE_CARGO: "1"
          DENO_BORINGCACHE_CARGO_ACCESS: consume
          DENO_BORINGCACHE_METADATA_PHASE: rolling-${{ matrix.transport }}
          DENO_BORINGCACHE_NATIVE_EVIDENCE_DIR: /tmp/deno-rolling-native
          DENO_CARGO_EVIDENCE_FILE: /tmp/deno-rolling-cargo.jsonl
        run: |
          set -euo pipefail
          mkdir -p /tmp/deno-rolling-native
          started_at="$(date +%s)"
          ./scripts/run-deno-build.sh 2>&1 | tee "/tmp/deno-rolling-cli-${{ matrix.transport }}.log"
          elapsed="$(( $(date +%s) - started_at ))"
          echo "elapsed_seconds=${elapsed}" >> "$GITHUB_OUTPUT"

      - name: Verify target, mtimes, Cargo, and sccache
        run: |
          test -x upstream/target/release/deno
          target_size="$(du -sb upstream/target | awk '{ print $1 }')"
          ./scripts/verify_boringcache_cargo.py \
            --source-root upstream \
            --target-root upstream/target \
            --cli-log "/tmp/deno-rolling-cli-${{ matrix.transport }}.log" \
            --cargo-messages /tmp/deno-rolling-cargo.jsonl \
            --native-evidence-dir /tmp/deno-rolling-native \
            --inspect-json "/tmp/deno-rolling-inspect-${{ matrix.transport }}.json" \
            --transport "${{ matrix.transport }}" \
            --elapsed-seconds "${{ steps.consume.outputs.elapsed_seconds }}" \
            --target-size-bytes "$target_size" \
            --cli-version "${{ inputs.cli_version }}" \
            --output "benchmark-results/proof-${{ matrix.transport }}.json"
          evidence_dir="benchmark-results/evidence-rolling-${{ matrix.transport }}"
          mkdir -p "$evidence_dir"
          cp "/tmp/deno-rolling-cli-${{ matrix.transport }}.log" "$evidence_dir/cli.log"
          cp /tmp/deno-rolling-cargo.jsonl "$evidence_dir/cargo.jsonl"
          cp "/tmp/deno-rolling-inspect-${{ matrix.transport }}.json" "$evidence_dir/inspect.json"
          cp /tmp/deno-rolling-native/*.json "$evidence_dir/"

      - name: Publish proof summary
        run: |
          jq -r '"### " + (.transport | ascii_upcase) + " Cargo proof\n\n- End to end: " + (.elapsed_seconds | tostring) + "s\n- Target: " + ((.target_size_bytes / 1073741824) | tostring) + " GiB\n- Layout: " + (.archive.cas_layout // .archive.storage_mode) + "\n- Cargo: " + (.cargo.fresh_targets | tostring) + " fresh, " + (.cargo.rebuilt_targets | tostring) + " rebuilt\n- sccache: " + (.sccache.cache_hits | tostring) + " hits, " + (.sccache.cache_misses | tostring) + " misses"' \
            "benchmark-results/proof-${{ matrix.transport }}.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rolling evidence
        uses: actions/upload-artifact@v6
        with:
          name: deno-cargo-proof-${{ matrix.transport }}
          path: benchmark-results
          if-no-files-found: error

  compare:
    name: Compare Cargo archive transports
    needs: consume-rolling
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Download base evidence
        uses: actions/download-artifact@v8
        with:
          pattern: deno-cargo-base-*
          path: benchmark-evidence
          merge-multiple: true

      - name: Download rolling evidence
        uses: actions/download-artifact@v8
        with:
          pattern: deno-cargo-proof-*
          path: benchmark-evidence
          merge-multiple: true

      - name: Render comparison
        run: |
          ./scripts/render_cargo_transport_comparison.py \
            --input-dir benchmark-evidence \
            --output-dir benchmark-results
          cat benchmark-results/cargo-transport-comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison
        uses: actions/upload-artifact@v6
        with:
          name: deno-cargo-transport-comparison
          path: benchmark-results
          if-no-files-found: error
