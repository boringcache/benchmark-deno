name: "Deno Cargo layer proof"
run-name: ${{ format('Deno Cargo layers | CLI {0}', inputs.cli_version || 'Action default') }}

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: Optional exact immutable BoringCache CLI release tag.
        required: false
        type: string
        default: ""
      runner_label:
        description: Optional runner label for a manual main-branch experiment.
        required: false
        type: string
        default: ""
  pull_request:
    paths:
      - ".boringcache.toml"
      - ".github/workflows/deno-cargo-product.yml"
      - "benchmark-source.env"
      - "plans/**"
      - "scripts/**"
      - "test/**"

permissions:
  actions: read
  contents: read

concurrency:
  group: benchmark-deno-cargo-layer-proof
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUST_LIB_BACKTRACE: 0

jobs:
  source:
    name: Resolve adjacent Deno source
    runs-on: ubuntu-24.04
    outputs:
      base_sha: ${{ steps.source.outputs.base_sha }}
      head_sha: ${{ steps.source.outputs.head_sha }}
      source_repository: ${{ steps.source.outputs.source_repository }}
    steps:
      - uses: actions/checkout@v6

      - name: Read the reviewed source pair
        id: source
        run: |
          set -euo pipefail
          source benchmark-source.env
          echo "base_sha=$DENO_BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$DENO_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "source_repository=$DENO_SOURCE_REPOSITORY" >> "$GITHUB_OUTPUT"

  cold:
    name: "Cold: target + sccache seed"
    needs: source
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: ${{ inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 240
    steps:
      - name: Configure git
        run: |
          git config --global core.symlinks true
          git config --global fetch.parallel 32

      - name: Checkout benchmark repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Checkout the Deno seed
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ needs.source.outputs.source_repository }}
          ref: ${{ needs.source.outputs.base_sha }}
          path: upstream
          fetch-depth: 2
          submodules: false

      - name: Prepare the seed source
        run: ./scripts/prepare-source.sh base

      - name: Clone submodule ./tests/util/std
        run: git -C upstream submodule update --init --recursive --depth=1 -- ./tests/util/std

      - name: Verify Deno Linux release recipe
        run: ./scripts/verify-deno-release-recipe.py upstream

      - name: Install Deno snapshot minifier runtime
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: Pre-install rustup 1.28.2 (workaround broken 1.29.0)
        run: ./scripts/preinstall-deno-rustup.sh

      - name: Expose Deno's pinned toolchain file
        run: ln -s upstream/rust-toolchain.toml rust-toolchain.toml

      - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621

      - name: Configure Deno Linux build environment
        run: ./scripts/setup-deno-linux.sh

      - name: Configure canary build
        run: echo "DENO_CANARY=true" >> "$GITHUB_ENV"

      - name: Configure frame-pointer panic traces
        run: ./scripts/configure-deno-frame-pointers.sh

      - name: Require an empty target
        run: |
          test ! -e upstream/target
          test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"

      - name: Start lane timing
        id: timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Select the cold primary CLI plan
        run: ./scripts/activate-cargo-plan.sh cold primary

      - name: Build the primary seed through the combined Cargo plan
        id: primary
        uses: boringcache/one@ab52a39d3d7358c22b359a6ffbf86cf74be9bf56 # v1 / 1.18.1
        with:
          cli-version: ${{ inputs.cli_version }}
          setup: none
          mode: cargo
          trust-policy: publish
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
          metadata-hints: phase=layers-cold-primary
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
          DENO_SNAPSHOT_MINIFY_SOURCES: "1"

      - name: Select the cold desktop CLI plan
        run: ./scripts/activate-cargo-plan.sh cold desktop

      - name: Build denort_desktop through the combined Cargo plan
        id: desktop
        uses: boringcache/one@ab52a39d3d7358c22b359a6ffbf86cf74be9bf56 # v1 / 1.18.1
        with:
          cli-version: ${{ inputs.cli_version }}
          setup: none
          mode: cargo
          trust-policy: publish
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
          metadata-hints: phase=layers-cold-desktop
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
          DENO_SNAPSHOT_MINIFY_SOURCES: "1"

      - name: Report cold-layer evidence
        run: |
          jq -e '.phases.restore.mode_evidence.target_cache_hit == false' \
            "${{ steps.primary.outputs.evidence-path }}"
          echo "lane_seconds=$(( $(date +%s) - ${{ steps.timer.outputs.started_at }} ))" >> "$GITHUB_STEP_SUMMARY"
          ./scripts/summarize-cargo-evidence.py \
            cold-primary "${{ steps.primary.outputs.evidence-path }}" \
            cold-desktop "${{ steps.desktop.outputs.evidence-path }}"

      - name: Retain cold product evidence
        uses: actions/upload-artifact@v6
        with:
          name: deno-cargo-layers-cold
          path: |
            ${{ steps.primary.outputs.evidence-path }}
            ${{ steps.desktop.outputs.evidence-path }}
          if-no-files-found: error

  warm:
    name: "${{ matrix.label }}"
    needs: [source, cold]
    runs-on: ${{ inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: sccache-only
            label: "sccache only: target excluded"
          - lane: combined
            label: "Combined: target + sccache"
    steps:
      - name: Configure git
        run: |
          git config --global core.symlinks true
          git config --global fetch.parallel 32

      - name: Checkout benchmark repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Checkout the adjacent Deno head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ needs.source.outputs.source_repository }}
          ref: ${{ needs.source.outputs.head_sha }}
          path: upstream
          fetch-depth: 2
          submodules: false

      - name: Prepare the adjacent source
        run: |
          ./scripts/prepare-source.sh head
          test "$(git -C upstream rev-parse HEAD^)" = "${{ needs.source.outputs.base_sha }}"

      - name: Clone submodule ./tests/util/std
        run: git -C upstream submodule update --init --recursive --depth=1 -- ./tests/util/std

      - name: Verify Deno Linux release recipe
        run: ./scripts/verify-deno-release-recipe.py upstream

      - name: Install Deno snapshot minifier runtime
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: Pre-install rustup 1.28.2 (workaround broken 1.29.0)
        run: ./scripts/preinstall-deno-rustup.sh

      - name: Expose Deno's pinned toolchain file
        run: ln -s upstream/rust-toolchain.toml rust-toolchain.toml

      - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621

      - name: Configure Deno Linux build environment
        run: ./scripts/setup-deno-linux.sh

      - name: Configure canary build
        run: echo "DENO_CANARY=true" >> "$GITHUB_ENV"

      - name: Configure frame-pointer panic traces
        run: ./scripts/configure-deno-frame-pointers.sh

      - name: Require an empty target
        run: |
          test ! -e upstream/target
          test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"

      - name: Start lane timing
        id: timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Select the primary CLI plan
        run: ./scripts/activate-cargo-plan.sh "${{ matrix.lane }}" primary

      - name: Build primary through the selected Cargo plan
        id: primary
        uses: boringcache/one@ab52a39d3d7358c22b359a6ffbf86cf74be9bf56 # v1 / 1.18.1
        with:
          cli-version: ${{ inputs.cli_version }}
          setup: none
          mode: cargo
          trust-policy: restore
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
          metadata-hints: phase=layers-${{ matrix.lane }}-primary
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ""
          DENO_SNAPSHOT_MINIFY_SOURCES: "1"

      - name: Select the desktop CLI plan
        run: ./scripts/activate-cargo-plan.sh "${{ matrix.lane }}" desktop

      - name: Build denort_desktop through the selected Cargo plan
        id: desktop
        uses: boringcache/one@ab52a39d3d7358c22b359a6ffbf86cf74be9bf56 # v1 / 1.18.1
        with:
          cli-version: ${{ inputs.cli_version }}
          setup: none
          mode: cargo
          trust-policy: restore
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
          metadata-hints: phase=layers-${{ matrix.lane }}-desktop
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ""
          DENO_SNAPSHOT_MINIFY_SOURCES: "1"

      - name: Require combined target restore and Deno freshness state
        if: matrix.lane == 'combined'
        run: |
          jq -e '.phases.restore.mode_evidence.target_cache_hit == true' \
            "${{ steps.primary.outputs.evidence-path }}"
          test -s upstream/target/.boringcache/cargo-freshness-v2.json

      - name: Require the sccache-only plan to exclude target transport
        if: matrix.lane == 'sccache-only'
        run: |
          jq -e '
            .phases.restore.mode_evidence.archive_entries |
            all(.kind != "cargo-target")
          ' "${{ steps.primary.outputs.evidence-path }}"

      - name: Report selected-layer evidence
        run: |
          echo "lane_seconds=$(( $(date +%s) - ${{ steps.timer.outputs.started_at }} ))" >> "$GITHUB_STEP_SUMMARY"
          ./scripts/summarize-cargo-evidence.py \
            "${{ matrix.lane }}-primary" "${{ steps.primary.outputs.evidence-path }}" \
            "${{ matrix.lane }}-desktop" "${{ steps.desktop.outputs.evidence-path }}"

      - name: Retain selected-layer evidence
        uses: actions/upload-artifact@v6
        with:
          name: deno-cargo-layers-${{ matrix.lane }}
          path: |
            ${{ steps.primary.outputs.evidence-path }}
            ${{ steps.desktop.outputs.evidence-path }}
            upstream/target/.boringcache/cargo-freshness-v2.json
          if-no-files-found: error

  report:
    name: Compare Cargo layers
    needs: [cold, warm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Download every lane's product evidence
        uses: actions/download-artifact@v6
        with:
          pattern: deno-cargo-layers-*
          path: layer-evidence

      - name: Publish the independent layer report
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          args=()
          while IFS= read -r evidence; do
            label="$(basename "$(dirname "$evidence")")/$(basename "$evidence")"
            args+=("$label" "$evidence")
          done < <(find layer-evidence -type f -name '*.json' -print | sort)
          test "${#args[@]}" -gt 0
          ./scripts/summarize-cargo-evidence.py "${args[@]}" |
            tee benchmark-results/deno-cargo-layer-proof.md

      - name: Retain the layer report
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-deno-cargo-layer-proof
          path: benchmark-results/deno-cargo-layer-proof.md
          if-no-files-found: error
