name: "Deno release hybrid cache proof"
run-name: ${{ inputs.cli_version == '' && 'Deno release hybrid cache proof' || format('Deno release hybrid cache proof | CLI {0}', inputs.cli_version) }}

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: Optional BoringCache CLI release tag for a canary run.
        required: false
        type: string
        default: ""

permissions:
  actions: write
  contents: read

jobs:
  actions-cache:
    name: Actions full target baseline
    uses: ./.github/workflows/deno-actions-cache.yml
    with:
      benchmark_id: deno-release-rust-cache
      build_profile: release
      cli_version: ${{ inputs.cli_version || 'v1.16.3' }}
    secrets: inherit

  boringcache-hybrid:
    name: BoringCache sccache plus ThinLTO archive
    uses: ./.github/workflows/deno-boringcache.yml
    with:
      benchmark_id: deno-release-rust-cache
      build_profile: release
      strategy: boringcache-hybrid
      cache_profile: release-hybrid
      cache_mode: sccache-plus-lto-archive
      cache_components: cargo-registry,remote-sccache,release-thinlto-archive
      cli_version: ${{ inputs.cli_version }}
    secrets: inherit

  compare:
    name: Compare release results
    needs: [actions-cache, boringcache-hybrid]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v6

      - name: Download phase results
        uses: actions/download-artifact@v8
        with:
          pattern: phase-deno-release-rust-cache-*
          path: benchmark-phases
          merge-multiple: true

      - name: Render comparison
        run: |
          ./scripts/render_comparison.py \
            --input-dir benchmark-phases \
            --output-dir benchmark-results \
            --benchmark deno-release-rust-cache \
            --candidate-strategy boringcache-hybrid \
            --title "Deno release hybrid cache proof"

      - name: Publish job summary
        run: cat benchmark-results/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-deno-release-hybrid-comparison
          path: benchmark-results
          if-no-files-found: error
