name: Deno RunsOn cache phase

on:
  workflow_call:
    inputs:
      provider:
        required: true
        type: string
      phase:
        required: true
        type: string
      cache_variant:
        required: false
        type: string
        default: target
      source_sha:
        required: false
        type: string
        default: ""
      restore_phase:
        required: false
        type: string
        default: ""
      expected_parent:
        required: false
        type: string
        default: ""
      rolling_step:
        required: false
        type: string
        default: ""
      rolling_previous:
        required: false
        type: string
        default: ""
      cli_version:
        required: false
        type: string
        default: ""
      sccache_diagnostics:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write
  id-token: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUST_LIB_BACKTRACE: "0"
  DENO_CANARY: "true"
  DENO_SNAPSHOT_MINIFY_SOURCES: "1"
  BORINGCACHE_TOKEN_FILE: /dev/null
  BORINGCACHE_NO_GIT: "true"

jobs:
  build:
    name: ${{ inputs.provider }} ${{ inputs.phase }}
    runs-on: ${{ inputs.provider == 'runs-on-cache' && format('runs-on={0}/cpu=16/ram=64/family=m7i.*+m7a/image=ubuntu24-full-x64/volume=300gb:gp3/env=benchmark/region=us-east-1/spot=false/extras=s3-cache', github.run_id) || format('runs-on={0}/cpu=16/ram=64/family=m7i.*+m7a/image=ubuntu24-full-x64/volume=300gb:gp3/env=benchmark/region=us-east-1/spot=false', github.run_id) }}
    timeout-minutes: 240
    steps:
      - uses: runs-on/action@efac073ea2507ec18797de3a81704201ade11d9d # v2.3.1
        with:
          sccache: ${{ inputs.provider == 'runs-on-cache' && inputs.cache_variant != 'target' && 's3' || '' }}
      - name: Start the workflow timer
        id: workflow_timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Configure git
        run: |
          git config --global core.symlinks true
          git config --global fetch.parallel 32
      - uses: actions/checkout@v6
      - name: Read pinned Deno source
        id: source
        run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"
      - name: Checkout pinned Deno source
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.source.outputs.DENO_SOURCE_REPOSITORY }}
          ref: ${{ inputs.source_sha != '' && inputs.source_sha || (inputs.phase == 'source_change' && steps.source.outputs.DENO_HEAD_SHA || steps.source.outputs.DENO_BASE_SHA) }}
          path: upstream
          fetch-depth: 5
          submodules: false
      - name: Prepare the exact source
        env:
          PHASE: ${{ inputs.phase }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_PARENT: ${{ inputs.expected_parent }}
        run: |
          set -euo pipefail
          if [[ -n "$SOURCE_SHA" ]]; then
            test "$(git -C upstream rev-parse HEAD)" = "$SOURCE_SHA"
            if [[ -n "$EXPECTED_PARENT" ]]; then
              test "$(git -C upstream rev-parse HEAD^)" = "$EXPECTED_PARENT"
            fi
          elif [[ "$PHASE" == source_change ]]; then
            ./scripts/prepare-source.sh head
          else
            ./scripts/prepare-source.sh base
          fi
          git -C upstream submodule update --init --recursive --depth=1 -- ./tests/util/std
          ./scripts/verify-deno-release-recipe.py upstream
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x
      - run: ./scripts/preinstall-deno-rustup.sh
      - run: ln -s upstream/rust-toolchain.toml rust-toolchain.toml
      - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621
      - name: Install sccache
        if: inputs.cache_variant != 'target'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Scope RunsOn direct S3 compiler cache
        if: inputs.provider == 'runs-on-cache' && inputs.cache_variant != 'target'
        run: |
          set -euo pipefail
          test -n "${SCCACHE_BUCKET:-}"
          test -n "${SCCACHE_REGION:-}"
          export SCCACHE_S3_KEY_PREFIX="cache/sccache/benchmark-deno/${{ inputs.cache_variant }}/r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          echo "SCCACHE_S3_KEY_PREFIX=$SCCACHE_S3_KEY_PREFIX" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json
          import subprocess

          stats = json.loads(subprocess.check_output(["sccache", "--show-stats", "--stats-format=json"]))
          location = stats.get("cache_location")
          if not isinstance(location, str) or location.split(",", 1)[0].strip().lower() != "s3":
              raise SystemExit(f"Expected direct S3 sccache backend, got {location!r}")
          print("Direct S3 sccache backend is active")
          PY
      - name: Configure Deno Linux release environment
        run: |
          set -euo pipefail
          test "$(grep -c '>/dev/null 2>&1$' scripts/setup-deno-linux.sh)" -eq 2
          sed -i 's@>/dev/null 2>&1$@>/dev/null 2>\&1 || true@' scripts/setup-deno-linux.sh
          ./scripts/setup-deno-linux.sh
      - name: Configure Deno frame pointers
        run: ./scripts/configure-deno-frame-pointers.sh
      - name: Select the same Cargo commands and a fresh cache cohort
        env:
          CACHE_VARIANT: ${{ inputs.cache_variant }}
          ROLLING_STEP: ${{ inputs.rolling_step }}
        run: |
          set -euo pipefail
          case "$CACHE_VARIANT" in
            target) compiler_cache=none; profile=cargo-product ;;
            target-sccache) compiler_cache=sccache; profile=cargo-product ;;
            sccache-only) compiler_cache=sccache; profile=compiler-only ;;
            *) echo "Unknown cache variant: $CACHE_VARIANT" >&2; exit 1 ;;
          esac
          sed -i 's|^workspace = ".*"|workspace = "boringcache/benchmark-runs-on-s3-clean"|' .boringcache.toml
          python3 ./scripts/select-deno-cargo-profile.py "$profile"
          scope="$CACHE_VARIANT-r$GITHUB_RUN_ID-a$GITHUB_RUN_ATTEMPT"
          if [[ -n "$ROLLING_STEP" ]]; then
            scope="$scope-rolling"
          fi
          ./scripts/scope-boringcache-run.sh "$scope" "$profile"
          sed -i "/^\[adapters.cargo\]$/a compiler-cache = \"$compiler_cache\"" .boringcache.toml
          test ! -e upstream/target
          test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"
      - name: Select the Cargo job lifecycle
        run: python3 ./scripts/select-deno-cargo-phase.py job
      - name: Start the cache and build timer
        id: timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Name Magic Cache keys
        id: magic_keys
        env:
          CACHE_VARIANT: ${{ inputs.cache_variant }}
          PHASE: ${{ inputs.phase }}
          ROLLING_STEP: ${{ inputs.rolling_step }}
          ROLLING_PREVIOUS: ${{ inputs.rolling_previous }}
          RESTORE_PHASE: ${{ inputs.restore_phase }}
        run: |
          set -euo pipefail
          if [[ -n "$ROLLING_STEP" ]]; then
            prefix="deno-magic-$CACHE_VARIANT-rolling-r$GITHUB_RUN_ID-a$GITHUB_RUN_ATTEMPT"
            echo "restore=$prefix-step$ROLLING_PREVIOUS" >> "$GITHUB_OUTPUT"
            echo "save=$prefix-step$ROLLING_STEP" >> "$GITHUB_OUTPUT"
          else
            prefix="deno-magic-$CACHE_VARIANT-r$GITHUB_RUN_ID-a$GITHUB_RUN_ATTEMPT"
            previous="${RESTORE_PHASE:-warm}"
            [[ "$PHASE" != warm ]] || previous=cold
            echo "restore=$prefix-$previous" >> "$GITHUB_OUTPUT"
            echo "save=$prefix-$PHASE" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore RunsOn Magic Cache
        id: magic_restore
        if: inputs.provider == 'runs-on-cache' && inputs.phase != 'cold' && inputs.cache_variant != 'sccache-only'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            upstream/target
          key: ${{ steps.magic_keys.outputs.restore }}
          fail-on-cache-miss: true
      - name: Record cache setup time
        id: setup_timer
        run: echo "seconds=$(( $(date +%s) - ${{ steps.timer.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"
      - name: Enable sccache diagnostics
        if: inputs.sccache_diagnostics && inputs.provider == 'boringcache' && inputs.cache_variant == 'sccache-only'
        run: |
          echo "SCCACHE_ERROR_LOG=$RUNNER_TEMP/sccache-errors.log" >> "$GITHUB_ENV"
          echo 'SCCACHE_LOG=debug' >> "$GITHUB_ENV"
      - name: Restore BoringCache for both Cargo commands
        id: boringcache_primary
        if: inputs.provider == 'boringcache'
        uses: boringcache/one@f0fb9b2d926a32b10c543e92093ba00c5a291b79 # v1 / 1.33.0
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: cargo
          trust-policy: publish
          working-directory: upstream
          fail-on-cache-error: true
          diagnostics: summary
      - name: Build Deno release binaries
        env:
          RUSTC_WRAPPER: ${{ inputs.cache_variant != 'target' && 'sccache' || '' }}
        run: python3 ./scripts/select-deno-cargo-phase.py run primary
      - name: Record primary compiler stats
        if: inputs.cache_variant != 'target'
        run: |
          mkdir -p benchmark-results
          sccache --show-stats --stats-format=json > benchmark-results/sccache-primary.json
      - name: Build denort_desktop
        env:
          RUSTC_WRAPPER: ${{ inputs.cache_variant != 'target' && 'sccache' || '' }}
        run: python3 ./scripts/select-deno-cargo-phase.py run desktop
      - name: Record final compiler stats
        if: inputs.cache_variant != 'target'
        run: sccache --show-stats --stats-format=json > benchmark-results/sccache-final.json
      - name: Summarize sccache diagnostics
        if: always() && inputs.sccache_diagnostics && inputs.provider == 'boringcache'
        run: python3 ./scripts/summarize-sccache-errors.py "$RUNNER_TEMP/sccache-errors.log"
      - name: Save RunsOn Magic Cache
        if: inputs.provider == 'runs-on-cache' && inputs.cache_variant != 'sccache-only'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            upstream/target
          key: ${{ steps.magic_keys.outputs.save }}
      - name: Verify release binaries and cache reuse
        env:
          PROVIDER: ${{ inputs.provider }}
          PHASE: ${{ inputs.phase }}
          CACHE_VARIANT: ${{ inputs.cache_variant }}
          MAGIC_HIT: ${{ steps.magic_restore.outputs.cache-hit }}
          BORINGCACHE_HIT: ${{ steps.boringcache_primary.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test -x upstream/target/release/deno
          test -x upstream/target/release/denort
          test -x upstream/target/release/test_server
          test -s upstream/target/release/libdenort.so
          if [[ "$PHASE" != cold && "$CACHE_VARIANT" != sccache-only ]]; then
            if [[ "$PROVIDER" == runs-on-cache ]]; then
              test "$MAGIC_HIT" = true
            else
              test "$BORINGCACHE_HIT" = true
            fi
          fi
      - name: Write phase evidence
        env:
          PROVIDER: ${{ inputs.provider }}
          PHASE: ${{ inputs.rolling_step != '' && 'commit' || inputs.phase }}
          LANE: ${{ inputs.rolling_step != '' && 'rolling' || (inputs.cache_variant == 'target' && 'fresh' || inputs.cache_variant) }}
          VARIANT: ${{ inputs.rolling_step != '' && format('step{0}{1}', inputs.rolling_step, inputs.phase == 'warm' && '-warm' || '') || '' }}
          SOURCE_SHA: ${{ inputs.source_sha != '' && inputs.source_sha || (inputs.phase == 'source_change' && steps.source.outputs.DENO_HEAD_SHA || steps.source.outputs.DENO_BASE_SHA) }}
          STARTED_AT: ${{ steps.timer.outputs.started_at }}
          WORKFLOW_STARTED_AT: ${{ steps.workflow_timer.outputs.started_at }}
          SETUP_SECONDS: ${{ inputs.provider == 'runs-on-cache' && steps.setup_timer.outputs.seconds || '0' }}
          CACHE_HIT: ${{ inputs.provider == 'runs-on-cache' && steps.magic_restore.outputs.cache-hit || steps.boringcache_primary.outputs.cache-hit }}
          EVIDENCE_PATH: ${{ steps.boringcache_primary.outputs.evidence-path }}
          MAGIC_HIT: ${{ steps.magic_restore.outputs.cache-hit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 ./scripts/collect-deno-cache-evidence.py \
            --provider "$PROVIDER" \
            --cache-variant "${{ inputs.cache_variant }}" \
            --primary-evidence "$EVIDENCE_PATH" \
            --magic-hit "$MAGIC_HIT" \
            --output benchmark-results/cache-evidence.json
          python3 ./scripts/benchmark-report.py phase \
            --benchmark deno-runson \
            --strategy "$PROVIDER" \
            --lane "$LANE" \
            --phase "$PHASE" \
            --variant "$VARIANT" \
            --mode cargo \
            --restore-or-setup-seconds "$SETUP_SECONDS" \
            --build-seconds "$(( $(date +%s) - STARTED_AT - SETUP_SECONDS ))" \
            --workflow-seconds "$(( $(date +%s) - WORKFLOW_STARTED_AT ))" \
            --cache-hit "$CACHE_HIT" \
            --source-repository denoland/deno \
            --source-sha "$SOURCE_SHA" \
            --evidence "$EVIDENCE_PATH" \
            --cache-evidence benchmark-results/cache-evidence.json
      - uses: actions/upload-artifact@v6
        with:
          name: phase-deno-runson-${{ inputs.provider }}-${{ inputs.rolling_step != '' && format('step{0}', inputs.rolling_step) || inputs.phase }}
          path: benchmark-results/
          if-no-files-found: error
