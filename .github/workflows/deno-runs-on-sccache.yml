name: Deno RunsOn target and sccache comparison
run-name: Deno native sccache and target archives on RunsOn (product defaults)

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: Optional exact BoringCache CLI release tag.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: deno-runs-on-rolling11
  cancel-in-progress: false
  queue: max

jobs:
  magic-cold:
    uses: ./.github/workflows/deno-runs-on-phase.yml
    with:
      provider: runs-on-cache
      phase: cold
      cache_variant: target-sccache

  boringcache-cold:
    uses: ./.github/workflows/deno-runs-on-phase.yml
    with:
      provider: boringcache
      phase: cold
      cache_variant: target-sccache
      cli_version: ${{ inputs.cli_version }}

  magic-warm:
    needs: magic-cold
    uses: ./.github/workflows/deno-runs-on-phase.yml
    with:
      provider: runs-on-cache
      phase: warm
      cache_variant: target-sccache

  boringcache-warm:
    needs: boringcache-cold
    uses: ./.github/workflows/deno-runs-on-phase.yml
    with:
      provider: boringcache
      phase: warm
      cache_variant: target-sccache
      cli_version: ${{ inputs.cli_version }}

  magic-source-change:
    needs: magic-warm
    uses: ./.github/workflows/deno-runs-on-phase.yml
    with:
      provider: runs-on-cache
      phase: source_change
      cache_variant: target-sccache

  boringcache-source-change:
    needs: boringcache-warm
    uses: ./.github/workflows/deno-runs-on-phase.yml
    with:
      provider: boringcache
      phase: source_change
      cache_variant: target-sccache
      cli_version: ${{ inputs.cli_version }}

  report:
    name: Compare cache phases
    needs: [magic-source-change, boringcache-source-change]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          pattern: phase-deno-runson-*
          path: phase-evidence
      - name: Read completed job timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p benchmark-results
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > benchmark-results/job-timings.json
      - name: Summarize comparable work
        run: |
          python3 ./scripts/benchmark-report.py summarize \
            --title "Deno native sccache and target archives on RunsOn" \
            --baseline-strategy runs-on-cache \
            --no-deltas \
            --input-dir phase-evidence \
            --jobs-json benchmark-results/job-timings.json \
            --output-dir benchmark-results
      - uses: actions/upload-artifact@v6
        with:
          name: deno-runson-sccache-comparison
          path: benchmark-results/
          if-no-files-found: error
